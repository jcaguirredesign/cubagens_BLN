<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cubagens Blumenau</title>
<link rel="icon" type="image/png" href="/brand/dragon-logo.png"/>
<link rel="apple-touch-icon" href="/brand/dragon-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{
  --bg:#011c44;--inset:#011a3f;--surface:#022a62;--surface-2:#012253;--surface-hi:#0b3c7c;
  --line:#0f4384;--line-soft:#0a3672;--fg:#eaf8ff;--fg-2:#b9d4ee;--muted:#8fb3d9;--faint:#6189b8;
  --accent:#0dd6fd;--accent-hi:#92effc;--accent-soft:rgba(13,214,253,.13);--ink:#02173f;--royal:#1383c0;
  --ok:#4ade80;--ok-soft:rgba(74,222,128,.13);--warn:#f5b84a;--warn-soft:rgba(245,184,74,.14);
  --crit:#ff6b78;--crit-soft:rgba(255,107,120,.14);--info:#5aa6ef;--info-soft:rgba(90,166,239,.16);
  --com:#5aa6ef;--com-soft:rgba(90,166,239,.16);
  --plate-white:#f3f5f7;--plate-blue:#0d3a8f;--plate-ink:#111318;--plate-edge:#9aa3b5;
  --f-display:'Space Grotesk','Inter',system-ui,sans-serif;--f-plate:'Saira Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(ellipse 70% 45% at 85% 0%,rgba(13,214,253,.14),transparent 70%),linear-gradient(rgba(146,239,252,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(146,239,252,.05) 1px,transparent 1px);background-size:100% 100%,34px 34px,34px 34px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%)}
#root{min-height:100vh;position:relative;z-index:1}
.cb-brand{font-family:'Space Grotesk','Inter',sans-serif}
@keyframes cb-fade-up{from{opacity:0}to{opacity:1}}
.cb-view-enter{animation:cb-fade-up .28s ease-out both}
@keyframes cb-shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.cb-skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-hi) 37%,var(--surface) 63%);background-size:400px 100%;animation:cb-shimmer 1.4s ease-in-out infinite;border-radius:6px}
button{transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background-color .12s ease}
button:active{transform:scale(0.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important}
}
.cb-page{padding:20px 20px;max-width:2000px;margin:0 auto;width:100%}
.cb-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.cb-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;min-height:52px;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.cb-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cb-modal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;width:min(96vw,600px);max-height:92vh;overflow-y:auto}
.cb-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}
.cb-frota-btn{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:20px 14px;cursor:pointer;text-align:center;transition:border-color .15s;user-select:none}
.cb-frota-btn:hover,.cb-frota-btn:active{border-color:var(--accent)}
.cb-field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cb-sync-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
@media (max-width:768px){.cb-page{padding:12px 10px}.cb-card{padding:12px 12px}.cb-nav{padding:6px 10px;min-height:48px}.cb-grid{grid-template-columns:repeat(2,1fr);gap:8px}.cb-modal-box{padding:16px 12px}.cb-hide-mobile{display:none!important}.cb-field-row{flex-direction:column}.cb-field-row>*{width:100%!important;min-width:unset!important}table{font-size:11px}th,td{padding:5px 6px!important}}
@media (max-width:400px){.cb-grid{grid-template-columns:1fr 1fr}.cb-nav-title{font-size:11px!important}.cb-nav-badge{display:none}}
@media (min-width:1024px){.cb-page{padding:28px 24px}.cb-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.cb-neon-wrap{position:relative;border-radius:16px;padding:2px;overflow:hidden}
.cb-neon-wrap::before{content:'';position:absolute;inset:-40%;z-index:0;background:conic-gradient(from 0deg,transparent 0deg,transparent 260deg,var(--accent) 300deg,var(--accent-hi) 330deg,var(--accent) 345deg,transparent 360deg);animation:cb-neon-spin 3.5s linear infinite;filter:blur(1px)}
.cb-neon-inner{position:relative;z-index:1}
@keyframes cb-neon-spin{to{transform:rotate(360deg)}}
.cb-logo-wrap{position:relative;width:clamp(90px,28vw,150px);height:clamp(90px,28vw,150px);margin:0 auto 18px}
.cb-logo-wrap::before{content:'';position:absolute;inset:-15%;z-index:0;background:radial-gradient(closest-side,rgba(13,214,253,.55),transparent 72%);filter:blur(10px)}
.cb-logo-emerge{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;opacity:0;animation:cb-logo-emerge 1.1s ease-out forwards;transform:scale(.85)}
@keyframes cb-logo-emerge{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}

/* ===== Issue #13 — placas, mapa, comercial, conferente ===== */
.cb-num{font-variant-numeric:tabular-nums}
.cb-nav-btn[aria-current="page"]{border-color:var(--accent)!important;color:var(--accent)!important;background:var(--accent-soft)!important}
.cb-h1{font-family:var(--f-display);font-size:clamp(20px,2.2vw,26px);font-weight:600;letter-spacing:-.01em;color:var(--fg);text-wrap:balance}
.cb-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.cb-sub{color:var(--muted);margin-top:6px;max-width:72ch;font-size:13.5px;line-height:1.5}
.cb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.cb-label-row{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line);margin:26px 0 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cb-label-row span:last-child{color:var(--faint);letter-spacing:.06em}
/* Placa Mercosul */
.cb-plate{position:relative;width:100%;max-width:100%;aspect-ratio:40/13;background:var(--plate-white);border-radius:7px;border:2px solid var(--plate-edge);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 0 rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;container-type:inline-size}
.cb-plate-band{background:var(--plate-blue);height:24%;display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:#fff}
.cb-plate-band .ms{font-size:max(6px,3.4cqw);font-weight:700;letter-spacing:.06em;opacity:.85}
.cb-plate-band .br{font-family:var(--f-plate);font-weight:700;letter-spacing:.32em;font-size:max(8px,6cqw);padding-left:.32em}
.cb-flag{width:9cqw;aspect-ratio:10/7;background:#1f9a4a;position:relative;border-radius:1px}
.cb-flag::before{content:"";position:absolute;inset:12% 8%;background:#f6d10b;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.cb-flag::after{content:"";position:absolute;width:34%;aspect-ratio:1;border-radius:50%;background:#1a3a8f;left:33%;top:26%}
.cb-plate-chars{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--f-plate);font-weight:700;color:var(--plate-ink);font-size:21cqw;letter-spacing:.06em;line-height:1;padding-top:2%}
.cb-dock{width:100%;aspect-ratio:40/13;border-radius:7px;border:2px dashed #2a65a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);container-type:inline-size}
.cb-dock b{font-family:var(--f-display);font-size:clamp(14px,13cqw,30px);letter-spacing:.14em;color:var(--fg)}
.cb-dock small{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.cb-mini-plate{display:inline-flex;flex-direction:column;width:76px;border-radius:3px;border:1px solid var(--plate-edge);overflow:hidden;background:var(--plate-white);vertical-align:middle;flex:none}
.cb-mini-plate i{height:5px;background:var(--plate-blue)}
.cb-mini-plate span{font-family:var(--f-plate);font-weight:700;color:var(--plate-ink);font-size:14px;text-align:center;letter-spacing:.05em;line-height:1.25}
.cb-mini-dock{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);border:1px dashed #2a65a8;border-radius:3px;padding:3px 8px}
.cb-frotas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.cb-frota{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;cursor:pointer;color:var(--fg);font-family:inherit}
.cb-frota:hover{border-color:var(--accent);box-shadow:0 0 22px rgba(13,214,253,.18)}
.cb-frota-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.cb-frota-foot .go{color:var(--accent);font-weight:500}
.cb-frota-foot .pend{color:var(--muted)}
/* KPIs, chips, pills */
.cb-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cb-kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cb-kpi b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.cb-kpi small{color:var(--muted);font-size:12px}
.cb-chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit}
.cb-chip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:var(--accent-soft)}
.cb-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.cb-pill.com{background:var(--com-soft);color:var(--com)}.cb-pill.exp{background:var(--accent-soft);color:var(--accent)}
.cb-pill.ok{background:var(--ok-soft);color:var(--ok)}.cb-pill.warn{background:var(--warn-soft);color:var(--warn)}
.cb-pill.crit{background:var(--crit-soft);color:var(--crit)}.cb-pill.mute{background:var(--line-soft);color:var(--muted)}
/* Mapa */
.cb-split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.cb-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.cb-col{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cb-col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 6px}
.cb-col-h h3{font-size:13px;font-weight:600;font-family:var(--f-display);color:var(--fg)}
.cb-col-empty{font-size:12px;color:var(--faint);padding:8px 4px}
.cb-nfc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;cursor:pointer;color:var(--fg);font-family:inherit}
.cb-nfc:hover{border-color:#2a65a8}
.cb-nfc.a2{border-left-color:var(--warn)}.cb-nfc.a3{border-left-color:var(--crit)}
.cb-nfc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cb-nfc-top b{font-family:var(--f-display);font-weight:600;font-size:15px}
.cb-nfc-top span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cb-nfc.a2 .cb-nfc-top span{color:var(--warn)}.cb-nfc.a3 .cb-nfc-top span{color:var(--crit)}
.cb-nfc-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.cb-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.cb-panel h3{font-size:13px;font-family:var(--f-display);font-weight:600;margin-bottom:12px;color:var(--fg)}
.cb-uf-row{display:grid;grid-template-columns:34px 1fr 28px;gap:10px;align-items:center;font-size:12.5px;margin-bottom:8px}
.cb-uf-track{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;display:flex}
.cb-uf-track i{display:block;height:100%}
.cb-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.cb-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* Tabela comercial */
.cb-tbl{width:100%;border-collapse:collapse;min-width:820px}
.cb-tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.cb-tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-size:13px}
.cb-tbl tr:last-child td{border-bottom:0}
.cb-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cb-nfcell b{font-family:var(--f-display);font-weight:600;font-size:14.5px;display:block}
.cb-nfcell small{color:var(--muted);font-size:12px}
.cb-steps{display:flex;gap:4px}.cb-steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.cb-steps i.on{background:var(--com)}.cb-steps i.done{background:var(--ok)}
/* Drawer */
.cb-scrim{position:fixed;inset:0;background:rgba(1,12,32,.65);z-index:180;animation:cb-fade-up .2s ease-out both}
.cb-drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:190;display:flex;flex-direction:column;animation:cb-slide .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes cb-slide{from{transform:translateX(100%)}to{transform:none}}
.cb-dr-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cb-dr-head h2{font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--fg)}
.cb-dr-head p{margin-top:4px;color:var(--muted);font-size:13px}
.cb-dr-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:22px}
.cb-dr-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.cb-dr-foot small{color:var(--muted);font-size:12px;max-width:36ch}
.cb-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cb-fact{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;min-width:0}
.cb-fact small{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.cb-fact span{font-weight:600;overflow-wrap:anywhere;font-size:13px}
.cb-blk h4{font-size:13px;font-family:var(--f-display);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--fg)}
.cb-hint{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.cb-drop{border:1.5px dashed #2a65a8;border-radius:10px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background-color .15s}
.cb-drop.over,.cb-drop:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.cb-drop b{color:var(--fg);font-weight:600}
.cb-file{display:grid;grid-template-columns:auto 48px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:7px 9px}
.cb-file.sel{border-color:var(--ok)}
.cb-thumb{width:48px;height:48px;border-radius:6px;background:var(--line-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted)}
.cb-file b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-file small{color:var(--muted);font-size:11.5px}
.cb-proof{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--ink)}
.cb-proof img{display:block;width:100%;max-height:280px;object-fit:contain}
/* Conferente */
.cb-lanc{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.cb-lanc-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.cb-frota-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cb-frota-bar .cb-plate,.cb-frota-bar .cb-dock{width:190px}
.cb-frota-bar .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.cb-frota-bar .who small{color:var(--muted);font-size:12px}
.cb-frota-bar .who b{font-family:var(--f-display);font-size:17px;font-weight:600}
.cb-lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.cb-lcard-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cb-lcard-h h3{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--fg)}
.cb-nota-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.cb-big{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:0 12px;height:50px;font-size:18px;font-weight:600;width:100%;color:var(--fg);font-family:inherit;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s,box-shadow .15s}
.cb-big::placeholder{color:var(--faint);font-weight:500}
.cb-big:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cb-big.bad{border-color:var(--crit)}
.cb-grp{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:14px;animation:cb-fade-up .25s ease-out both}
.cb-grp-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cb-grp-h b{font-size:11px;letter-spacing:.14em;color:var(--accent-hi);font-weight:700}
.cb-grp-h .tools{margin-left:auto;display:flex;gap:6px}
.cb-unit{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px}
.cb-unit button{background:transparent;border:0;border-radius:5px;padding:3px 10px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit}
.cb-unit button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.cb-dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.cb-box-prev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-left:1px dashed var(--line);padding-left:14px;text-align:center}
.cb-box-prev svg{width:100%;max-width:110px;height:auto}
.cb-box-prev small{color:var(--muted);font-size:11px}
.cb-box-prev b{font-family:var(--f-display);font-size:16px;color:var(--accent)}
.cb-sum{position:sticky;top:64px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;z-index:20}
.cb-sum-m3 small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.cb-sum-m3 b{font-family:var(--f-display);font-size:34px;font-weight:600;color:var(--accent);line-height:1.1}
.cb-sum-m3 span{color:var(--muted);font-size:13px;margin-left:4px}
.cb-vol{display:flex;flex-direction:column;gap:6px}
.cb-vol-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.cb-vol-top b{color:var(--fg)}
.cb-vol-bar{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.cb-vol-bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease,background-color .2s}
.cb-vol-bar i.ok{background:var(--ok)}.cb-vol-bar i.over{background:var(--crit)}
.cb-checks{display:flex;flex-direction:column;gap:6px;font-size:12.5px;list-style:none}
.cb-checks li{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.cb-checks li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--crit)}
.cb-checks li.ok::before{background:var(--ok)}
.cb-checks li.ok{color:var(--fg)}
@media (max-width:1100px){
  .cb-split,.cb-lanc{grid-template-columns:1fr}
  .cb-sum{top:auto;bottom:10px;box-shadow:0 -8px 30px rgba(1,12,32,.55);flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 14px}
  .cb-sum-m3 b{font-size:24px}
  .cb-sum .cb-vol{flex:1;min-width:160px}
  .cb-sum .cb-checks{display:none}
  .cb-sum > button{flex:1 1 100%}
}
@media (max-width:640px){
  .cb-nota-grid{grid-template-columns:1fr 1fr}
  .cb-nota-grid > div:first-child{grid-column:1/-1}
  .cb-grp{grid-template-columns:1fr}
  .cb-dims{grid-template-columns:1fr 1fr}
  .cb-box-prev{border-left:0;border-top:1px dashed var(--line);padding:12px 0 0;flex-direction:row;justify-content:space-between}
  .cb-box-prev svg{max-width:70px}
  .cb-frota-bar .cb-plate,.cb-frota-bar .cb-dock{width:150px}
  .cb-frotas{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cb-facts{grid-template-columns:1fr 1fr}
}

function parseNum(v){const n=parseFloat(String(v??'').trim().replace(',','.'));return isFinite(n)?n:0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fmtDate(d){return new Date(d).toLocaleString('pt-BR')}
function fmtDim(v){return `${(parseFloat(v)||0).toFixed(2)}m`}
function novoGrupo(){return {id:uid(),qtd:'',altura:'',largura:'',comprimento:'',unidade:'m'}}
function dimsM(g){const t=v=>g.unidade==='mm'?parseNum(v)/1000:parseNum(v);return {alturaM:t(g.altura),larguraM:t(g.largura),comprimentoM:t(g.comprimento)}}
function calcM3(grupos){return grupos.reduce((s,g)=>{const t=v=>g.unidade==='mm'?parseNum(v)/1000:parseNum(v);return s+t(g.largura)*t(g.altura)*t(g.comprimento)*(parseInt(g.qtd)||0)},0)}
function isToday(d){const a=new Date(d),b=new Date();return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rangeISO(dataIni,dataFim){return {iniISO:new Date(dataIni+'T00:00:00').toISOString(),fimISO:new Date(dataFim+'T23:59:59.999').toISOString()}}
function normalizarPendencia(p){return {...p,grupos:(p.grupos||[]).sort((a,b)=>a.seq-b.seq),cotacoes:(p.cotacoes||[]).sort((a,b)=>new Date(a.criado_em)-new Date(b.criado_em))}}

function Dashboard({ frotas, onFrota }) {

function CaixaPreview({ grupo }) {
  const t = (v) => (grupo.unidade === "mm" ? parseNum(v) / 1000 : parseNum(v));
  let L = t(grupo.largura),
    C = t(grupo.comprimento),
    A = t(grupo.altura);
  const vazio = !(L > 0 && C > 0 && A > 0);
  if (vazio) {
    L = 1;
    C = 1;
    A = 1;
  }
  const mx = Math.max(L, C, A);
  L /= mx;
  C /= mx;
  A /= mx;
  const k = 38,
    cx = Math.cos(Math.PI / 6);
  const P = (x, y, z) => [60 + (x - z) * cx * k, 78 - y * k + (x + z) * 0.5 * k];
  const o = [P(0, 0, 0), P(L, 0, 0), P(L, 0, C), P(0, 0, C), P(0, A, 0), P(L, A, 0), P(L, A, C), P(0, A, C)];
  const ys = o.map((p) => p[1]);
  const dy = 50 - (Math.min(...ys) + Math.max(...ys)) / 2;
  const pts = (ids) => ids.map((i) => o[i][0].toFixed(1) + "," + (o[i][1] + dy).toFixed(1)).join(" ");
  return (
    <svg viewBox="0 0 120 100" role="img" aria-label="Formato do volume" style={{ opacity: vazio ? 0.25 : 1, transition: "opacity .2s" }}>
      <polygon points={pts([0, 1, 5, 4])} fill="var(--accent)" stroke="var(--ink)" strokeWidth="1" />
      <polygon points={pts([0, 3, 7, 4])} fill="var(--royal)" stroke="var(--ink)" strokeWidth="1" />
      <polygon points={pts([4, 5, 6, 7])} fill="var(--accent-hi)" stroke="var(--ink)" strokeWidth="1" />
    </svg>
  );
}

function fmtM3(n) {

}
function FrotaView({ frota, clientes, session, perfil, onBack, showToast }) {

        session,
        perfil,

                  </div>

                <label style={S.label} htmlFor="cb-nota">
                  Nº da NF
                </label>
                <input
                  id="cb-nota"
                  data-cub="1"
                  className={"cb-big" + (tentou && !form.nota.trim() ? " bad" : "")}

        </aside>

      {confirmDel && (
        <ModalConfirmDel reg={confirmDel} onConfirm={() => handleDelete(confirmDel.id)} onCancel={() => setConfirmDel(null)} />
      )}
    </div>
  );
}

const MOTIVOS_COM = {
  sem_cotacao: "Aguardando cotação",
  aguardando_aprovacao: "Aguardando aprovação do fornecedor",
  aguardando_liberacao: "Pronta para liberar",
  divergencia_frete: "Divergência de valor de frete",
};
const MOTIVOS_EXP = {
  divergencia_cubagem: "Divergência de cubagem/volume",
  falta_mercadoria: "Falta de mercadoria",
  aguardando_carregamento: "Aguardando carregamento",
  cte_anulado: "CT-e anulado — reemitir",
  aguardando_expedicao: "Liberada, aguardando expedição",
};
const MOTIVOS_EXP_EDITAVEIS = ["divergencia_cubagem", "falta_mercadoria", "aguardando_carregamento"];
const ANEXO_TIPOS = ["image/jpeg", "image/png", "image/webp", "application/pdf"];
const ANEXO_MAX = 10 * 1024 * 1024;
function motivoComercial(p) {
  if (p.status_comercial === "liberado") return null;
  if (p.motivo_comercial === "divergencia_frete") return "divergencia_frete";
  if (!(p.cotacoes || []).length) return "sem_cotacao";
  if (!p.aprovacao_path) return "aguardando_aprovacao";
  return "aguardando_liberacao";
}
function motivoExpedicao(p) {
  if (p.status_expedicao === "expedido") return null;
  if (p.status_expedicao === "cte_anulado") return "cte_anulado";
  if (p.motivo_expedicao) return p.motivo_expedicao;
  if (p.houve_falta) return "falta_mercadoria";
  if (p.status_comercial === "liberado") return "aguardando_expedicao";
  return null;
}
function diasParado(p) {
  return Math.max(0, Math.floor((Date.now() - new Date(p.criado_em).getTime()) / 86400000));
}
function textoDias(d) {
  return d === 0 ? "hoje" : d === 1 ? "1 dia" : d + " dias";
}
function etapaComercial(p) {
  if (p.status_comercial === "liberado") return { k: "ok", t: "Liberada", step: 4 };
  if (!(p.cotacoes || []).length) return { k: "crit", t: "Sem cotação", step: 1 };
  if (!p.aprovacao_path) return { k: "warn", t: "Aguardando aprovação", step: 2 };
  if (!p.cotacao_aprovada_id) return { k: "com", t: "Marque a cotação aprovada", step: 3 };
  return { k: "com", t: "Pronta para liberar", step: 3 };
}
function fmtMoedaBR(v) {
  return v == null ? "—" : "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function validarAnexo(file, soImagem) {
  if (!file) return "Nenhum arquivo selecionado.";
  const tipos = soImagem ? ANEXO_TIPOS.filter((t) => t.startsWith("image/")) : ANEXO_TIPOS;
  if (!tipos.includes(file.type)) return soImagem ? "Envie uma imagem PNG, JPG ou WEBP." : "Envie PDF ou imagem (PNG, JPG ou WEBP).";
  if (file.size > ANEXO_MAX) return "Arquivo maior que 10 MB.";
  return null;
}
function useUrlAssinada(path) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    let ativo = true;
    setUrl(null);
    if (path)
      db.urlNfImagem(path)
        .then((u) => ativo && setUrl(u))
        .catch(() => {});
    return () => {
      ativo = false;
    };
  }, [path]);
  return url;
}
function ZonaArquivo({ id, rotulo, dica, aceita, onArquivo, desabilitado }) {
  const [arrastando, setArrastando] = useState(false);
  return (
    <label
      htmlFor={id}
      className={"cb-drop" + (arrastando ? " over" : "")}
      style={{ opacity: desabilitado ? 0.6 : 1, cursor: desabilitado ? "default" : "pointer" }}
      onDragOver={(e) => {
        e.preventDefault();
        if (!desabilitado) setArrastando(true);
      }}
      onDragLeave={() => setArrastando(false)}
      onDrop={(e) => {
        e.preventDefault();
        setArrastando(false);
        if (!desabilitado && e.dataTransfer.files?.[0]) onArquivo(e.dataTransfer.files[0]);
      }}
    >
      <b>{rotulo}</b>
      <span>{dica}</span>
      <input
        id={id}
        type="file"
        accept={aceita}
        style={{ display: "none" }}
        disabled={desabilitado}
        onChange={(e) => {
          if (e.target.files?.[0]) onArquivo(e.target.files[0]);
          e.target.value = "";
        }}
      />
    </label>
  );
}

function ControleComercial({ p, perfil, onClose, onChanged, showToast }) {
  const podeEditar = isComercial(perfil) && p.status_comercial !== "liberado";
  const [numero, setNumero] = useState("");

  const [ocupado, setOcupado] = useState(false);
  const [obs, setObs] = useState(p.observacao_comercial || "");
  const [divergencia, setDivergencia] = useState(p.motivo_comercial === "divergencia_frete");
  const urlAprov = useUrlAssinada(p.aprovacao_path);
  const etapa = etapaComercial(p);
  const cotacoes = p.cotacoes || [];
  const executar = async (fn, ok) => {
    setOcupado(true);
    try {
      await fn();
      if (ok) showToast(ok);
      await onChanged();
    } catch (e) {
      showToast(e.message || "Erro inesperado.", "err");
    }
    setOcupado(false);
  };
  const adicionar = () => {
    const n = numero.trim();
    const v = parseNum(valor);
    if (!n) return showToast("Informe o número da cotação.", "err");
    if (!(v >= 0) || String(valor).trim() === "") return showToast("Informe o valor do frete.", "err");
    const erro = validarAnexo(arquivo, false);
    if (erro) return showToast(erro, "err");
    executar(async () => {
      await db.adicionarCotacao(p.id, { numero: n, freteValor: v, file: arquivo });
      setNumero("");
      setValor("");
      setArquivo(null);
    }, "Cotação " + n + " anexada.");
  };
  const enviarAprovacao = (file) => {
    const erro = validarAnexo(file, true);
    if (erro) return showToast(erro, "err");
    executar(async () => {
      const path = await db.uploadAnexo(file, p.id, "aprovacao");
      await db.atualizarPendencia(p.id, { aprovacao_path: path, aprovacao_nome: file.name || "print-colado.png" });
    }, "Print de aprovação anexado.");
  };
  useEffect(() => {
    if (!podeEditar || p.aprovacao_path) return;
    const onPaste = (e) => {
      const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
      if (!item) return;
      e.preventDefault();
      const f = item.getAsFile();
      const nome = new File([f], "print-aprovacao-" + Date.now() + "." + (f.type.split("/")[1] || "png"), { type: f.type });
      enviarAprovacao(nome);
    };
    document.addEventListener("paste", onPaste);
    return () => document.removeEventListener("paste", onPaste);
  }, [podeEditar, p.aprovacao_path, p.id]);
  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);

  const mExp = motivoExpedicao(p);

            <div className="cb-fact">
              <small>Destino</small>
              <span>{p.municipio_destino ? p.municipio_destino + (p.uf_destino ? "/" + p.uf_destino : "") : p.uf_destino || "—"}</span>
            </div>
            <div className="cb-fact">
              <small>Carga</small>
              <span className="cb-num">
                {p.qtd_volumes || 0} vol · {(parseFloat(p.m3_total) || 0).toFixed(2).replace(".", ",")} m³

              <button
                type="button"
                style={{ ...S.btnY, opacity: p.cotacao_aprovada_id && p.aprovacao_path && !ocupado ? 1 : 0.4 }}

                Liberar nota
              </button>
            </>
          ) : (
            <small>Somente o Comercial altera esta parte.</small>
          )}
        </div>
      </aside>
    </>
  );
}

  return (
    <div className="cb-tbl-wrap">
      <table className="cb-tbl">
        <thead>
          <tr>
            <th>Nota fiscal</th>
            <th>Frota</th>
            <th>Destino</th>
            <th>Carga</th>

            <th>Parada há</th>
            <th></th>

                <td className="cb-num" style={{ whiteSpace: "nowrap" }}>
                  {p.qtd_volumes || 0} vol · {(parseFloat(p.m3_total) || 0).toFixed(2).replace(".", ",")} m³
                </td>
                <td className="cb-num">{(p.cotacoes || []).length}</td>
                <td>{p.aprovacao_path ? <span className="cb-pill ok">Anexada</span> : <span style={{ color: "var(--muted)" }}>—</span>}</td>
                <td>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    <span className={"cb-pill " + e.k}>{e.t}</span>
                    <span className="cb-steps" aria-hidden="true">
                      {[1, 2, 3].map((i) => (
                        <i key={i} className={e.step > i || e.step === 4 ? "done" : e.step === i ? "on" : ""} />
                      ))}
                    </span>
                  </div>
                </td>
                <td>
                  <span className={"cb-pill " + (d >= 3 ? "crit" : d >= 2 ? "warn" : "mute")}>{textoDias(d)}</span>
                </td>
                <td>
                  <button type="button" style={p.status_comercial === "liberado" ? S.btnS : S.btnY} onClick={() => onAbrir(p)}>
                    {p.status_comercial === "liberado" ? "Ver" : "Abrir controle"}
                  </button>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}
function MapaPendencias({ perfil, showToast, onAbrirComercial, onAbrirExpedicao, versao }) {
  const [lista, setLista] = useState(null);
  const [setor, setSetor] = useState("todos");
  const [busca, setBusca] = useState("");
  useEffect(() => {
    let ativo = true;
    db.listarPendencias()
      .then((l) => ativo && setLista(l))
      .catch((e) => {
        showToast("Erro ao carregar pendências: " + e.message, "err");
        ativo && setLista([]);
      });
    return () => {
      ativo = false;
    };
  }, [versao]);
  if (!lista)
    return (
      <div className="cb-page">
        <SkeletonBar width={280} height={28} />
        <div className="cb-board" style={{ marginTop: 20 }}>
          {[0, 1, 2, 3].map((i) => (
            <div key={i} className="cb-skel" style={{ height: 160, borderRadius: 12 }} />
          ))}
        </div>
      </div>
    );
  const abertas = lista.filter((p) => p.status_expedicao !== "expedido");
  const entradas = [];
  abertas.forEach((p) => {
    const mc = motivoComercial(p);
    const me = motivoExpedicao(p);
    if (mc) entradas.push({ p, setor: "comercial", motivo: mc });
    if (me) entradas.push({ p, setor: "expedicao", motivo: me });
  });
  const q = busca.trim().toLowerCase();
  const visiveis = entradas.filter(
    (e) =>
      (setor === "todos" || e.setor === setor) &&
      (!q || [e.p.nf_numero, e.p.cliente, e.p.frota_placa, e.p.municipio_destino].join(" ").toLowerCase().includes(q)),
  );
  const colunas = [
    ...Object.keys(MOTIVOS_COM).map((k) => ({ k, setor: "comercial", label: MOTIVOS_COM[k] })),
    ...Object.keys(MOTIVOS_EXP).map((k) => ({ k, setor: "expedicao", label: MOTIVOS_EXP[k] })),
  ].filter((c) => setor === "todos" || c.setor === setor);
  const comCom = abertas.filter((p) => motivoComercial(p)).length;
  const comExp = abertas.filter((p) => motivoExpedicao(p)).length;
  const paradas = abertas.filter((p) => diasParado(p) >= 3).length;
  const m3 = abertas.reduce((s, p) => s + (parseFloat(p.m3_total) || 0), 0);
  const ufs = {};
  abertas.forEach((p) => {
    const uf = p.uf_destino || "—";
    ufs[uf] = ufs[uf] || { c: 0, e: 0 };
    if (motivoComercial(p)) ufs[uf].c++;
    else ufs[uf].e++;
  });
  const maxUf = Math.max(1, ...Object.values(ufs).map((u) => u.c + u.e));
  const frotasCont = {};
  abertas.forEach((p) => {
    const f = p.frota_placa || "";
    frotasCont[f] = (frotasCont[f] || 0) + 1;
  });
  const abrir = (e) => {
    if (e.setor === "expedicao" && isExpedicao(perfil)) onAbrirExpedicao(e.p);
    else onAbrirComercial(e.p);
  };
  return (
    <div className="cb-page">
      <div className="cb-head">
        <div>
          <div className="cb-eyebrow">Visível para Comercial e Expedição</div>
          <h1 className="cb-h1">Mapa de pendências</h1>
          <p className="cb-sub">Notas fiscais que ainda não seguiram viagem, agrupadas pelo motivo. A cor da borda mostra há quanto tempo a nota está parada.</p>
        </div>
      </div>
      <div className="cb-kpis">
        <div className="cb-kpi">
          <b>{abertas.length}</b>
          <small>notas pendentes</small>
        </div>
        <div className="cb-kpi">
          <b style={{ color: "var(--com)" }}>{comCom}</b>
          <small>com o Comercial</small>
        </div>
        <div className="cb-kpi">
          <b style={{ color: "var(--accent)" }}>{comExp}</b>
          <small>com a Expedição</small>
        </div>
        <div className="cb-kpi">
          <b style={{ color: "var(--crit)" }}>{paradas}</b>
          <small>paradas há 3+ dias</small>
        </div>
        <div className="cb-kpi">
          <b>{m3.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</b>
          <small>m³ retidos</small>
        </div>
      </div>
      <div className="cb-label-row">
        <span>Pendências por motivo</span>
        <span>
          {visiveis.length} de {entradas.length}
        </span>
      </div>
      <div className="cb-row" style={{ marginBottom: 16, alignItems: "center" }}>
        {[
          ["todos", "Todos os setores"],
          ["comercial", "Comercial"],
          ["expedicao", "Expedição"],
        ].map(([k, l]) => (
          <button key={k} type="button" className="cb-chip" aria-pressed={setor === k} onClick={() => setSetor(k)}>
            {l}
          </button>
        ))}
        <input
          style={{ ...S.input, width: 240, maxWidth: "100%" }}
          type="search"
          value={busca}
          onChange={(e) => setBusca(e.target.value)}
          placeholder="Buscar NF, cliente, placa ou cidade"
          aria-label="Buscar"
        />
      </div>
      <div className="cb-split">
        <div className="cb-board">
          {colunas.map((c) => {
            const itens = visiveis.filter((e) => e.setor === c.setor && e.motivo === c.k).sort((a, b) => diasParado(b.p) - diasParado(a.p));
            return (
              <div key={c.setor + c.k} className="cb-col">
                <div className="cb-col-h">
                  <h3>{c.label}</h3>
                  <span className={"cb-pill " + (c.setor === "comercial" ? "com" : "exp")}>{c.setor === "comercial" ? "Comercial" : "Expedição"}</span>
                </div>
                {itens.length === 0 ? (
                  <div className="cb-col-empty">Nenhuma nota com este motivo.</div>
                ) : (
                  itens.map((e) => {
                    const d = diasParado(e.p);
                    return (
                      <button
                        key={e.p.id + e.setor}
                        type="button"
                        className={"cb-nfc" + (d >= 3 ? " a3" : d >= 2 ? " a2" : "")}
                        onClick={() => abrir(e)}
                      >
                        <div className="cb-nfc-top">
                          <b className="cb-num">NF {e.p.nf_numero || "—"}</b>
                          <span>{textoDias(d)}</span>
                        </div>
                        <div style={{ fontSize: 13, overflowWrap: "anywhere" }}>{e.p.cliente}</div>
                        <div className="cb-nfc-meta">
                          <MiniPlaca placa={e.p.frota_placa} />
                          <span>{e.p.municipio_destino ? e.p.municipio_destino + "/" + (e.p.uf_destino || "") : e.p.uf_destino || "—"}</span>
                          <span className="cb-num">{(parseFloat(e.p.m3_total) || 0).toFixed(1).replace(".", ",")} m³</span>
                        </div>
                      </button>
                    );
                  })
                )}
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div className="cb-panel">
            <h3>Destino das pendências</h3>
            {Object.keys(ufs).length === 0 ? (
              <div className="cb-col-empty">Nenhuma nota pendente.</div>
            ) : (
              Object.entries(ufs)
                .sort((a, b) => b[1].c + b[1].e - (a[1].c + a[1].e))
                .map(([uf, u]) => (
                  <div key={uf} className="cb-uf-row">
                    <b>{uf}</b>
                    <div className="cb-uf-track" title={u.c + " com o Comercial · " + u.e + " com a Expedição"}>
                      <i style={{ width: (u.c / maxUf) * 100 + "%", background: "var(--com)" }} />
                      <i style={{ width: (u.e / maxUf) * 100 + "%", background: "var(--accent)" }} />
                    </div>
                    <span className="cb-num" style={{ textAlign: "right" }}>
                      {u.c + u.e}
                    </span>
                  </div>
                ))
            )}
            <div className="cb-legend">
              <span>
                <i style={{ background: "var(--com)" }} />
                Comercial
              </span>
              <span>
                <i style={{ background: "var(--accent)" }} />
                Expedição
              </span>
            </div>
          </div>
          <div className="cb-panel">
            <h3>Por frota</h3>
            {Object.keys(frotasCont).length === 0 ? (
              <div className="cb-col-empty">Nenhuma nota pendente.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {Object.entries(frotasCont).map(([f, n]) => (
                  <div key={f} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                    <MiniPlaca placa={f} />
                    <span className="cb-num" style={{ color: "var(--muted)" }}>
                      {n} {n === 1 ? "nota" : "notas"}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="cb-panel">
            <h3>Tempo parado</h3>
            <div className="cb-legend" style={{ marginTop: 0 }}>
              <span>
                <i style={{ background: "var(--line)" }} />
                até 1 dia
              </span>
              <span>
                <i style={{ background: "var(--warn)" }} />2 dias
              </span>
              <span>
                <i style={{ background: "var(--crit)" }} />3 dias ou mais
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function PendenciaEmissao({ modo, perfil, session, frotas, clientes, showToast, onFrota, onAbrirComercial, versao }) {
  const [lista, setLista] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editPend, setEditPend] = useState(null);
  const [painelExp, setPainelExp] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [buscaNf, setBuscaNf] = useState("");
  const [mesRef, setMesRef] = useState(() => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  });
  const recarregar = useCallback(async () => {
    setCarregando(true);
    try {
      setLista(await db.listarPendencias());
    } catch (e) {
      showToast("Erro ao carregar pendências: " + e.message, "err");
    }
    setCarregando(false);
  }, [showToast]);
  useEffect(() => {
    recarregar();
  }, [recarregar, versao]);
  const handleDelete = async (id) => {
    try {
      await db.deletarPendencia(id);
      setConfirmDel(null);
      showToast("Pendência excluída.", "err");
      await recarregar();
    } catch (e) {
      showToast("Erro: " + e.message, "err");
    }
  };
  const fmtMoeda = (v) =>
    v == null ? "—" : "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const filtrar = (arr) =>
    buscaNf.trim() ? arr.filter((p) => (p.nf_numero || "").toLowerCase().includes(buscaNf.trim().toLowerCase())) : arr;
  const pendentes = filtrar(lista.filter((p) => p.status_expedicao !== "expedido"));
  const expedidos = filtrar(
    lista.filter((p) => p.status_expedicao === "expedido" && p.expedido_em && p.expedido_em.slice(0, 7) === mesRef),
  );
  const NUM_COLS = 15;
  const FaltaBadge = ({ p }) =>
    p.houve_falta ? (
      <div style={{ ...S.badge, background: "var(--crit-soft)", color: "var(--crit)", marginTop: 3 }}>⚠ falta {p.qtd_falta || ""}</div>
    ) : null;
  const ExpedicaoCell = ({ p }) =>
    isExpedicao(perfil) ? (
      <button
        style={{
          ...S.btnS,
          fontSize: 11,
          padding: "3px 8px",
          borderColor: STATUS_EXP_COLORS[p.status_expedicao]?.color,
          color: STATUS_EXP_COLORS[p.status_expedicao]?.color,
        }}
        onClick={() => setPainelExp(p)}
      >
        {STATUS_EXP_LABELS[p.status_expedicao]} ✎
      </button>
    ) : (
      <StatusBadge map={STATUS_EXP_COLORS} value={p.status_expedicao} label={STATUS_EXP_LABELS[p.status_expedicao]} />
    );
  const MotivoCell = ({ p }) => {
    const me = motivoExpedicao(p);
    const mc = motivoComercial(p);
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 4, minWidth: 150 }}>
        {me && <span className="cb-pill exp" style={{ whiteSpace: "normal" }}>{MOTIVOS_EXP[me]}</span>}
        {mc && <span className="cb-pill com" style={{ whiteSpace: "normal" }}>{MOTIVOS_COM[mc]}</span>}
        {!me && !mc && <span style={{ color: "var(--muted)" }}>—</span>}
      </div>
    );
  };
  const ComercialCell = ({ p }) =>
    isComercial(perfil) ? (
      <button
        style={{
          ...S.btnS,
          fontSize: 11,
          padding: "3px 8px",
          borderColor: p.status_comercial === "liberado" ? "var(--info)" : "var(--warn)",
          color: p.status_comercial === "liberado" ? "var(--info)" : "var(--warn)",
        }}
        onClick={() => onAbrirComercial(p)}
      >
        {p.status_comercial === "liberado" ? "Liberado" : "Em análise"} ✎
      </button>
    ) : (
      <StatusBadge
        map={{ em_analise: { bg: "var(--warn-soft)", color: "var(--warn)" }, liberado: { bg: "var(--info-soft)", color: "var(--info)" } }}
        value={p.status_comercial}
        label={p.status_comercial === "liberado" ? "Liberado" : "Em análise"}
      />
    );
  const Linha = ({ p, modo }) => (
    <React.Fragment>
      <tr
        style={{
          background:
            p.status_expedicao === "cte_anulado" ? "rgba(251,146,60,0.20)" : modo === "liberado" ? "rgba(90,166,239,.18)" : "transparent",
        }}
      >
        <td style={{ ...S.td, fontSize: 10, whiteSpace: "nowrap" }}>{fmtDate(p.criado_em)}</td>
        <td className="cb-hide-mobile" style={{ ...S.td, fontSize: 10, color: "var(--muted)" }}>
          {p.criado_por_nome || "—"}
        </td>
        <td style={S.td}>{p.cliente}</td>
        <td style={{ ...S.td, fontWeight: 700, color: "var(--accent)", whiteSpace: "nowrap" }}>{p.frota_placa || "—"}</td>
        <td style={{ ...S.td, whiteSpace: "nowrap" }}>{p.nf_numero || "—"}</td>
        <td style={{ ...S.td, textAlign: "center" }}>
          {p.qtd_volumes}
          <FaltaBadge p={p} />
        </td>
        <td className="cb-hide-mobile" style={S.td}>
          <GruposDetalhe grupos={p.grupos} />
        </td>
        <td style={{ ...S.td, fontWeight: 700, whiteSpace: "nowrap" }}>{parseFloat(p.m3_total).toFixed(4)}</td>
        <td style={S.td}>
          <ExpedicaoCell p={p} />
        </td>
        {modo === "pendente" && (
          <td style={S.td}>
            <MotivoCell p={p} />
          </td>
        )}
        <td className="cb-hide-mobile" style={{ ...S.td, fontSize: 11, maxWidth: 130 }}>
          {p.observacao_expedicao || "—"}
        </td>
        <td style={S.td}>
          <ComercialCell p={p} />
        </td>
        <td className="cb-hide-mobile" style={{ ...S.td, fontSize: 11, maxWidth: 130 }}>
          {p.observacao_comercial || "—"}
        </td>
        <td style={{ ...S.td, fontSize: 11, whiteSpace: "nowrap" }}>{p.cotacao_numero || "—"}</td>
        <td style={{ ...S.td, fontSize: 11, whiteSpace: "nowrap" }}>{fmtMoeda(p.frete_valor)}</td>
        <td className="cb-hide-mobile" style={{ ...S.td, fontSize: 10, whiteSpace: "nowrap" }}>
          {p.chave_nf || "—"}
        </td>
        {modo === "liberado" && (
          <>
            <td style={{ ...S.td, fontSize: 10, whiteSpace: "nowrap" }}>{p.expedido_em ? fmtDate(p.expedido_em) : "—"}</td>
            <td className="cb-hide-mobile" style={{ ...S.td, fontSize: 10 }}>
              {p.expedido_por_nome || "—"}
            </td>
          </>
        )}
        <td style={S.td}>
          <div style={{ display: "flex", gap: 4 }}>
            <button style={{ ...S.btnS, padding: "3px 7px", fontSize: 11 }} onClick={() => setEditPend(p)}>
              ✎
            </button>
            {podeExcluirPendencia(perfil) && (
              <button style={{ ...S.btnD, padding: "3px 7px", fontSize: 11 }} onClick={() => setConfirmDel(p)}>
                🗑
              </button>
            )}
          </div>
        </td>
      </tr>
      {p.status_expedicao === "cte_anulado" && (
        <tr style={{ background: "rgba(251,146,60,0.30)" }}>
          <td
            colSpan={modo === "liberado" ? NUM_COLS + 2 : NUM_COLS + 1}
            style={{
              padding: "6px 10px",
              textAlign: "center",
              fontSize: 12,
              fontWeight: 700,
              color: "#fb923c",
              letterSpacing: 1,
              borderBottom: "1px solid var(--line)",
            }}
          >
            🚫 CTE ANULADO — Nº {p.cte_anulado_numero || "—"}
          </td>
        </tr>
      )}
    </React.Fragment>
  );
  const Header = ({ modo }) => (
    <tr>
      <th style={S.th}>Data</th>
      <th className="cb-hide-mobile" style={S.th}>
        Inserido por
      </th>
      <th style={S.th}>Cliente</th>
      <th style={S.th}>Frota</th>
      <th style={S.th}>NF</th>
      <th style={S.th}>Vol.</th>
      <th className="cb-hide-mobile" style={S.th}>
        Medidas
      </th>
      <th style={S.th}>M³</th>
      <th style={S.th}>Expedição</th>
      {modo === "pendente" && <th style={S.th}>Motivo</th>}
      <th className="cb-hide-mobile" style={S.th}>
        Obs. Exp.
      </th>
      <th style={S.th}>Comercial</th>
      <th className="cb-hide-mobile" style={S.th}>
        Obs. Com.
      </th>
      <th style={S.th}>Cotação</th>
      <th style={S.th}>Valor frete</th>
      <th className="cb-hide-mobile" style={S.th}>
        Chave NF
      </th>
      {modo === "liberado" && (
        <>
          <th style={S.th}>Expedido em</th>
          <th className="cb-hide-mobile" style={S.th}>
            Expedido por
          </th>
        </>
      )}
      <th style={S.th}>Ações</th>
    </tr>
  );
  return (
    <div className="cb-page">
      <div className="cb-head">
        <div>
          <div className="cb-eyebrow">{modo === "comercial" ? "Somente Comercial" : "Somente Expedição"}</div>
          <h1 className="cb-h1">{modo === "comercial" ? "Comercial" : "Expedição"}</h1>
          <p className="cb-sub">
            {modo === "comercial"
              ? "Controle por nota: anexe as cotações e o print do fornecedor aprovando o embarque. A nota só é liberada com a cotação aprovada marcada e o print."
              : "Lance a cubagem por frota, abra pendências de emissão e trate as notas que estão paradas com a Expedição."}
          </p>
        </div>
        <div className="cb-row" style={{ alignItems: "center" }}>
          <input
            style={{ ...S.input, width: 200 }}
            value={buscaNf}
            onChange={(e) => setBuscaNf(e.target.value)}
            placeholder="Buscar por NF"
            aria-label="Buscar por NF"
          />
          {modo === "expedicao" && isExpedicao(perfil) && (
            <button style={S.btnY} onClick={() => setShowForm(true)}>
              + Nova pendência
            </button>
          )}
        </div>
      </div>
      {modo === "expedicao" && (
        <>
          <div className="cb-label-row" style={{ marginTop: 0 }}>
            <span>Selecionar frota</span>
            <span>{(frotas || []).length} frotas</span>
          </div>
          <FrotasGrid
            frotas={frotas}
            onFrota={onFrota}
            contagem={carregando ? null : (f) => {
              const n = lista.filter((p) => p.status_expedicao !== "expedido" && p.frota_placa === f.placa).length;
              return n ? n + (n === 1 ? " pendência" : " pendências") : "sem pendência";
            }}
          />
          <div style={{ height: 22 }} />
        </>
      )}
      {carregando ? (
        <SkeletonTableRows rows={5} cols={9} />
      ) : (
        <>
          {modo === "comercial" ? (
            <>
              <div className="cb-kpis">
                <div className="cb-kpi">
                  <b style={{ color: "var(--crit)" }}>{pendentes.filter((p) => etapaComercial(p).step === 1).length}</b>
                  <small>sem cotação</small>
                </div>
                <div className="cb-kpi">
                  <b style={{ color: "var(--warn)" }}>{pendentes.filter((p) => etapaComercial(p).step === 2).length}</b>
                  <small>aguardando aprovação</small>
                </div>
                <div className="cb-kpi">
                  <b style={{ color: "var(--com)" }}>{pendentes.filter((p) => etapaComercial(p).step === 3).length}</b>
                  <small>prontas para liberar</small>
                </div>
                <div className="cb-kpi">
                  <b style={{ color: "var(--ok)" }}>{pendentes.filter((p) => p.status_comercial === "liberado").length}</b>
                  <small>liberadas, aguardando expedição</small>
                </div>
              </div>
              <div className="cb-label-row">
                <span>Controle por nota fiscal</span>
                <span>Cotação → Aprovação → Liberação</span>
              </div>
              <div style={{ marginBottom: 14 }}>
                <TabelaComercial
                  lista={[...pendentes].sort(
                    (a, b) => (a.status_comercial === "liberado" ? 1 : 0) - (b.status_comercial === "liberado" ? 1 : 0) || diasParado(b) - diasParado(a),
                  )}
                  onAbrir={onAbrirComercial}
                />
              </div>
            </>
          ) : (
          <div className="cb-card">
            <div style={S.secT}>Pendentes / em análise ({pendentes.length})</div>
            <div style={{ fontSize: 10, color: "var(--muted)", marginBottom: 10 }}>Fica aqui até ser expedido, independente do mês.</div>
            {pendentes.length === 0 ? (
              <p style={{ color: "var(--muted)", fontSize: 13 }}>Nenhuma pendência encontrada.</p>
            ) : (
              <div className="cb-table-wrap">
                <table style={S.table}>
                  <thead>
                    <Header modo="pendente" />
                  </thead>
                  <tbody>
                    {pendentes.map((p) => (
                      <Linha key={p.id} p={p} modo="pendente" />
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
          )}
          <div className="cb-card">
            <div className="cb-row" style={{ alignItems: "center", marginBottom: 2 }}>
              <div style={S.secT}>Liberados/expedidos ({expedidos.length})</div>
              <input
                style={{ ...S.input, width: 160, marginLeft: "auto" }}
                type="month"
                value={mesRef}
                onChange={(e) => setMesRef(e.target.value)}
              />
            </div>
            <div style={{ fontSize: 10, color: "var(--muted)", marginBottom: 10 }}>
              Relatório mensal — filtra pela data em que foi marcado "Expedido".
            </div>
            {expedidos.length === 0 ? (
              <p style={{ color: "var(--muted)", fontSize: 13 }}>Nenhuma liberação encontrada neste mês.</p>
            ) : (
              <div className="cb-table-wrap">
                <table style={S.table}>
                  <thead>
                    <Header modo="liberado" />
                  </thead>
                  <tbody>
                    {expedidos.map((p) => (
                      <Linha key={p.id} p={p} modo="liberado" />
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </>
      )}
      {showForm && (
        <PendenciaModal
          frotas={frotas}
          clientes={clientes}
          perfil={perfil}
          session={session}
          onClose={() => setShowForm(false)}
          onSave={() => {
            setShowForm(false);
            showToast("Pendência criada!");
            recarregar();
          }}
        />
      )}
      {editPend && (
        <PendenciaModal
          pendencia={editPend}
          frotas={frotas}
          clientes={clientes}
          perfil={perfil}
          session={session}
          onClose={() => setEditPend(null)}
          onSave={() => {
            setEditPend(null);
            showToast("Pendência atualizada!");
            recarregar();
          }}
        />
      )}
      {painelExp && (
        <PainelExpedicao
          p={painelExp}
          onClose={() => setPainelExp(null)}
          onSaved={() => {
            setPainelExp(null);
            showToast("Expedição atualizada!");
            recarregar();
          }}
        />
      )}
      {confirmDel && (
        <div style={S.modal} onClick={(e) => e.target === e.currentTarget && setConfirmDel(null)}>
          <div className="cb-modal-box" style={{ maxWidth: 380 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: "var(--crit)", marginBottom: 14 }}>⚠️ EXCLUIR PENDÊNCIA</div>
            <div style={{ fontSize: 13, color: "var(--fg-2)", lineHeight: 2, marginBottom: 18 }}>
              Excluir pendência de <b style={{ color: "var(--fg)" }}>{confirmDel.cliente}</b>?<br />
              <span style={{ color: "var(--crit)" }}>Esta ação não pode ser desfeita.</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...S.btnS, flex: 1 }} onClick={() => setConfirmDel(null)}>
                Cancelar
              </button>
              <button
                style={{ ...S.btnD, flex: 1, background: "var(--crit-soft)", fontWeight: 700 }}
                onClick={() => handleDelete(confirmDel.id)}
              >
                Confirmar
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function viewInicial(p) {
  if (!p) return "dashboard";
  if (p.role === "user") return "dashboard";
  if (podeVerPendencias(p)) return "mapa";
  return "dashboard";
}
function menuDe(p) {
  if (!p) return [];
  const m = [];
  if (podeVerPendencias(p)) m.push(["mapa", "Mapa"]);
  if (isExpedicao(p)) m.push(["expedicao", "Expedição"]);
  if (isComercial(p)) m.push(["comercial", "Comercial"]);
  if (podeLancar(p)) m.push(["dashboard", "Lançar cubagem"]);
  if (podeHistorico(p)) m.push(["historico", "Histórico"]);
  if (isAdmin(p)) m.push(["admin", "Admin"]);
  return m;
}
function App() {
  const [session, setSession] = useState(null);
  const [perfil, setPerfil] = useState(null);
  const [frotas, setFrotas] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [view, setView] = useState("dashboard");
  const [frota, setFrota] = useState(null);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);
  const [trocaSenhaVoluntaria, setTrocaSenhaVoluntaria] = useState(false);
  const [solicitacoesPendentes, setSolicitacoesPendentes] = useState(0);
  const [drawerPend, setDrawerPend] = useState(null);
  const [painelExpPend, setPainelExpPend] = useState(null);
  const [versao, setVersao] = useState(0);
  const viewInicialDe = useRef(null);
  const showToast = useCallback((msg, type = "ok") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  }, []);
  const aplicarViewInicial = (p) => {
    if (!p || viewInicialDe.current === p.id) return;
    viewInicialDe.current = p.id;
    setFrota(null);
    setView(viewInicial(p));
  };
  const abrirComercial = (p) => setDrawerPend(p);
  const atualizarDrawer = async () => {
    if (!drawerPend) return;
    try {
      setDrawerPend(await db.obterPendencia(drawerPend.id));
    } catch (e) {
      showToast("Erro ao recarregar a nota: " + e.message, "err");
    }
    setVersao((v) => v + 1);
  };
  const irPara = (v) => {
    setFrota(null);
    setView(v);
  };
  const carregarDados = useCallback(async () => {
    const [f, c] = await Promise.all([db.listarFrotas(), db.listarClientes()]);
    setFrotas(f);
    setClientes(c);
  }, []);
  const atualizarBadgeSolicitacoes = useCallback(async (p) => {
    if (!isAdmin(p)) return;
    try {
      setSolicitacoesPendentes(await db.contarSolicitacoesSenha());
    } catch {}
  }, []);
  const [erroFatal, setErroFatal] = useState("");
  useEffect(() => {
    sb.auth.getSession().then(async ({ data: { session } }) => {
      try {
        if (session) {
          setSession(session);
          const p = await db.getPerfil(session.user.id);
          setPerfil(p);
          aplicarViewInicial(p);
          await carregarDados();
          await atualizarBadgeSolicitacoes(p);
        }
      } catch (e) {
        setErroFatal(e.message || "Erro ao carregar sessão.");
      }
      setLoading(false);
    });
    const {
      data: { subscription },
    } = sb.auth.onAuthStateChange(async (event, session) => {
      try {
        if (session) {
          setSession(session);
          const p = await db.getPerfil(session.user.id);
          setPerfil(p);
          aplicarViewInicial(p);
          await carregarDados();
          await atualizarBadgeSolicitacoes(p);
        } else {
          viewInicialDe.current = null;
          setDrawerPend(null);
          setPainelExpPend(null);
          setSession(null);
          setPerfil(null);
          setFrotas([]);
          setClientes([]);
          setView("dashboard");
          setFrota(null);
          setSolicitacoesPendentes(0);
        }
      } catch (e) {
        setErroFatal(e.message || "Erro ao carregar sessão.");
      }
    });
    return () => subscription.unsubscribe();
  }, [carregarDados, atualizarBadgeSolicitacoes]);
  if (erroFatal)
    return (
      <div style={S.center}>
        <div style={S.box}>
          <div style={{ ...S.logoT, color: "var(--crit)" }}>Erro ao carregar</div>
          <div style={S.errBox}>{erroFatal}</div>
          <button
            style={{ ...S.btnP, marginTop: 16 }}
            onClick={() => {
              sb.auth.signOut();
              window.location.reload();
            }}
          >
            Sair e tentar de novo
          </button>
        </div>
      </div>
    );
  if (loading)
    return (
      <div
        style={{
          minHeight: "100vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          background: "linear-gradient(135deg,var(--inset),var(--surface))",
        }}
      >
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 22, fontWeight: 700, color: "var(--accent)", letterSpacing: 2 }}>CUBAGENS</div>
          <div style={{ fontSize: 12, color: "var(--muted)", letterSpacing: 2, marginTop: 10 }}>CARREGANDO...</div>
        </div>
      </div>
    );
  if (!session) return <Login onLogin={(e, s) => db.signIn(e, s)} />;
  if (perfil?.deve_trocar_senha)
    return (
      <TrocaSenha
        obrigatoria
        onSave={async (novaSenha) => {
          await db.trocarSenha(novaSenha, session.user.id);
          setPerfil((p) => ({ ...p, deve_trocar_senha: false }));
          showToast("Senha atualizada!");
        }}
      />
    );
  return (
    <div style={{ minHeight: "100vh", background: "var(--inset)", color: "var(--fg)", fontFamily: "'Inter',sans-serif" }}>
      <nav className="cb-nav">
        <span className="cb-nav-title cb-brand" style={{ fontSize: 13, fontWeight: 700, color: "var(--accent)", letterSpacing: 2, flex: 1 }}>
          ATUALCARGAS <span style={{ color: "var(--muted)", fontWeight: 500, fontSize: 11 }}>CUBAGENS BLN</span>
        </span>
        <span className="cb-nav-badge" style={{ fontSize: 11, color: "var(--muted)" }}>
          {perfil?.nome}
        </span>
        <span className="cb-nav-badge">
          <RoleBadge role={perfil?.role} />
        </span>
        {menuDe(perfil).map(([v, rotulo]) => (
          <button
            key={v}
            className="cb-nav-btn"
            aria-current={view === v || (v === "dashboard" && view === "frota") ? "page" : undefined}
            style={{ ...S.btnS, position: "relative" }}
            onClick={() => irPara(v)}
          >
            {rotulo}
            {v === "admin" && solicitacoesPendentes > 0 && (
              <span
                style={{
                  position: "absolute",
                  top: -6,
                  right: -6,
                  background: "var(--crit)",
                  color: "#fff",
                  borderRadius: 10,
                  fontSize: 10,
                  fontWeight: 700,
                  padding: "1px 5px",
                  lineHeight: 1.4,
                }}
              >
                {solicitacoesPendentes}
              </span>
            )}
          </button>
        ))}
        <button style={S.btnS} onClick={() => setTrocaSenhaVoluntaria(true)}>
          Senha
        </button>
        <button style={S.btnD} onClick={() => db.signOut()}>
          Sair
        </button>
      </nav>
      {trocaSenhaVoluntaria && (
        <TrocaSenha
          onClose={() => setTrocaSenhaVoluntaria(false)}
          onSave={async (novaSenha) => {
            await db.trocarSenha(novaSenha, session.user.id);
            setTrocaSenhaVoluntaria(false);
            showToast("Senha atualizada!");
          }}
        />
      )}
      {toast && (
        <div
          style={{
            position: "fixed",
            top: 58,
            right: 10,
            left: 10,
            zIndex: 300,
            padding: "10px 14px",
            borderRadius: 8,
            fontSize: 13,
            fontFamily: "inherit",
            background: toast.type === "ok" ? "var(--ok-soft)" : "var(--crit-soft)",
            border: `1px solid ${toast.type === "ok" ? "var(--ok)" : "var(--crit)"}`,
            color: toast.type === "ok" ? "var(--ok)" : "var(--crit)",
            maxWidth: 380,
            marginLeft: "auto",
          }}
        >
          {toast.msg}
        </div>
      )}
      <div key={view} className="cb-view-enter">
        {view === "dashboard" && podeLancar(perfil) && (
          <Dashboard
            frotas={frotas}
            onFrota={(f) => {
              setFrota(f);
              setView("frota");
            }}
          />
        )}
        {view === "frota" && frota && podeLancar(perfil) && (
          <FrotaView
            frota={frota}
            clientes={clientes}
            session={session}
            perfil={perfil}
            onBack={() => irPara("dashboard")}
            showToast={showToast}
          />
        )}
        {view === "mapa" && podeVerPendencias(perfil) && (
          <MapaPendencias
            perfil={perfil}
            showToast={showToast}
            versao={versao}
            onAbrirComercial={abrirComercial}
            onAbrirExpedicao={setPainelExpPend}
          />
        )}
        {(view === "expedicao" && isExpedicao(perfil)) || (view === "comercial" && isComercial(perfil)) ? (
          <PendenciaEmissao
            modo={view}
            perfil={perfil}
            session={session}
            frotas={frotas}
            clientes={clientes}
            showToast={showToast}
            versao={versao}
            onAbrirComercial={abrirComercial}
            onFrota={(f) => {
              setFrota(f);
              setView("frota");
            }}
          />
        ) : null}
        {view === "admin" && isAdmin(perfil) && (
          <AdminView
            perfil={perfil}
            session={session}
            frotas={frotas}
            setFrotas={setFrotas}
            clientes={clientes}
            setClientes={setClientes}
            showToast={showToast}
            onSolicitacoesAtualizadas={() => atualizarBadgeSolicitacoes(perfil)}
          />
        )}
        {view === "historico" && podeHistorico(perfil) && <Historico frotas={frotas} perfil={perfil} showToast={showToast} />}
        {!menuDe(perfil).some(([v]) => v === view || (v === "dashboard" && view === "frota")) && (
          <div className="cb-page">
            <div className="cb-card" style={{ textAlign: "center", padding: 40 }}>
              <div className="cb-h1" style={{ fontSize: 18, marginBottom: 6 }}>Sem acesso a esta página</div>
              <p style={{ color: "var(--muted)", fontSize: 13, marginBottom: 14 }}>Seu perfil não tem permissão para esta área.</p>
              <button style={S.btnY} onClick={() => irPara(viewInicial(perfil))}>
                Ir para o início
              </button>
            </div>
          </div>
        )}
      </div>
      {drawerPend && (
        <ControleComercial
          key={drawerPend.id}
          p={drawerPend}
          perfil={perfil}
          showToast={showToast}
          onClose={() => setDrawerPend(null)}
          onChanged={atualizarDrawer}
        />
      )}
      {painelExpPend && (
        <PainelExpedicao
          p={painelExpPend}
          onClose={() => setPainelExpPend(null)}
          onSaved={() => {
            setPainelExpPend(null);
            showToast("Expedição atualizada!");
            setVersao((v) => v + 1);
          }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
