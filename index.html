<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0f1117;font-family:'Inter',sans-serif;font-size:14px}
#root{min-height:100vh}
.cb-page{padding:20px 16px;max-width:1200px;margin:0 auto;width:100%}
.cb-card{background:#1a1f2e;border:1px solid #2a3050;border-radius:12px;padding:18px 20px;margin-bottom:14px}
.cb-nav{background:#1a1f2e;border-bottom:1px solid #2a3050;padding:0 16px;display:flex;align-items:center;min-height:52px;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.cb-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cb-modal-box{background:#1a1f2e;border:1px solid #2a3050;border-radius:14px;padding:24px 20px;width:min(96vw,600px);max-height:92vh;overflow-y:auto}
.cb-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}
.cb-frota-btn{background:#1a1f2e;border:2px solid #2a3050;border-radius:12px;padding:20px 14px;cursor:pointer;text-align:center;transition:border-color .15s;user-select:none}
.cb-frota-btn:hover,.cb-frota-btn:active{border-color:#f0c040}
.cb-field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cb-sync-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
@media (max-width:768px){.cb-page{padding:12px 10px}.cb-card{padding:12px 12px}.cb-nav{padding:6px 10px;min-height:48px}.cb-grid{grid-template-columns:repeat(2,1fr);gap:8px}.cb-modal-box{padding:16px 12px}.cb-hide-mobile{display:none!important}.cb-field-row{flex-direction:column}.cb-field-row>*{width:100%!important;min-width:unset!important}table{font-size:11px}th,td{padding:5px 6px!important}}
@media (max-width:400px){.cb-grid{grid-template-columns:1fr 1fr}.cb-nav-title{font-size:11px!important}.cb-nav-badge{display:none}}
@media (min-width:1024px){.cb-page{padding:28px 24px}.cb-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.cb-neon-wrap{position:relative;border-radius:16px;padding:2px;overflow:hidden}
.cb-neon-wrap::before{content:'';position:absolute;inset:-40%;z-index:0;background:conic-gradient(from 0deg,transparent 0deg,transparent 260deg,#f0c040 300deg,#fff3c0 330deg,#f0c040 345deg,transparent 360deg);animation:cb-neon-spin 3.5s linear infinite;filter:blur(1px)}
.cb-neon-inner{position:relative;z-index:1}
@keyframes cb-neon-spin{to{transform:rotate(360deg)}}
.cb-logo-wrap{position:relative;width:clamp(90px,28vw,150px);height:clamp(90px,28vw,150px);margin:0 auto 18px}
.cb-logo-wrap::before{content:'';position:absolute;inset:-15%;z-index:0;background:radial-gradient(closest-side,rgba(240,192,64,.55),transparent 72%);filter:blur(10px)}
.cb-logo-emerge{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;opacity:0;animation:cb-logo-emerge 1.1s ease-out forwards;transform:scale(.85)}
@keyframes cb-logo-emerge{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
</style>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fmtDate(d){return new Date(d).toLocaleString('pt-BR')}
function fmtDim(v){return `${(parseFloat(v)||0).toFixed(2)}m`}
function novoGrupo(){return {id:uid(),qtd:'',altura:'',largura:'',comprimento:'',unidade:'m'}}
function dimsM(g){const t=v=>g.unidade==='mm'?(parseFloat(v)||0)/1000:parseFloat(v)||0;return {alturaM:t(g.altura),larguraM:t(g.largura),comprimentoM:t(g.comprimento)}}
function calcM3(grupos){return grupos.reduce((s,g)=>{const t=v=>g.unidade==='mm'?(parseFloat(v)||0)/1000:parseFloat(v)||0;return s+t(g.largura)*t(g.altura)*t(g.comprimento)*(parseInt(g.qtd)||0)},0)}
function isToday(d){const a=new Date(d),b=new Date();return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rangeISO(dataIni,dataFim){return {iniISO:new Date(dataIni+'T00:00:00').toISOString(),fimISO:new Date(dataFim+'T23:59:59.999').toISOString()}}

async removerCliente(id){const {error}=await sb.from('clientes').delete().eq('id',id);if(error) throw error},
async listarRegistrosPorPeriodo(dataIni,dataFim,frotaId){const {iniISO,fimISO}=rangeISO(dataIni,dataFim);let q=sb.from('registros').select('*, grupos(*)').gte('criado_em',iniISO).lte('criado_em',fimISO).order('criado_em',{ascending:false});if(frotaId) q=q.eq('frota_id',frotaId);const {data,error}=await q;if(error) throw error;return (data||[]).map(r=>({...r,grupos:(r.grupos||[]).sort((a,b)=>a.seq-b.seq)}))},

async redefinirSenha(userId,novaSenha,accessToken){const res=await fetch('/api/admin/redefinir-senha',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+accessToken},body:JSON.stringify({userId,novaSenha})});const data=await res.json().catch(()=>({}));if(!res.ok) throw new Error(data.error||'Erro ao redefinir senha.');return data},
async excluirUsuario(userId,accessToken){const res=await fetch('/api/admin/deletar-usuario',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+accessToken},body:JSON.stringify({userId})});const data=await res.json().catch(()=>({}));if(!res.ok) throw new Error(data.error||'Erro ao excluir usuário.');return data},
async salvarRegistro(reg,grupos,session,perfil){const {data:r,error:e1}=await sb.from('registros').insert({frota_id:reg.frotaId,frota_placa:reg.frotaPlaca,cliente:reg.cliente,nota:reg.nota,qtd_total:reg.qtdTotal,m3_total:reg.m3Total,user_id:session.user.id,user_email:session.user.email,user_nome:perfil.nome}).select().single();if(e1) throw e1;const gd=grupos.map((g,i)=>({registro_id:r.id,seq:i+1,qtd:parseInt(g.qtd)||0,unidade:g.unidade||'m',altura_m:g.alturaM??0,largura_m:g.larguraM??0,comprimento_m:g.comprimentoM??0,m3_grupo:(g.alturaM??0)*(g.larguraM??0)*(g.comprimentoM??0)*(parseInt(g.qtd)||0)}));const {error:e2}=await sb.from('grupos').insert(gd);if(e2) throw e2;return {...r,grupos:gd}},
async editarRegistro(regId,grupos,motivo,m3Total,perfil){const {error:e1}=await sb.from('registros').update({m3_total:m3Total,editado:true,editado_por:perfil.email,motivo_edicao:motivo,data_edicao:new Date().toISOString()}).eq('id',regId);if(e1) throw e1;await sb.from('grupos').delete().eq('registro_id',regId);const gd=grupos.map((g,i)=>({registro_id:regId,seq:i+1,qtd:parseInt(g.qtd)||0,unidade:g.unidade||'m',altura_m:g.alturaM??0,largura_m:g.larguraM??0,comprimento_m:g.comprimentoM??0,m3_grupo:(g.alturaM??0)*(g.larguraM??0)*(g.comprimentoM??0)*(parseInt(g.qtd)||0)}));const {error:e2}=await sb.from('grupos').insert(gd);if(e2) throw e2;await sb.from('historico_edicoes').insert({registro_id:regId,user_email:perfil.email,motivo})},
async deletarRegistro(id){const {error}=await sb.from('registros').delete().eq('id',id);if(error) throw error},
async listarUsuarios(){const {data,error}=await sb.from('perfis').select('*').order('criado_em');if(error) throw error;return data||[]},
async contarSolicitacoesSenha(){const {count,error}=await sb.from('perfis').select('*',{count:'exact',head:true}).eq('solicitou_reset_senha',true);if(error) throw error;return count||0},

const S={

const ROLE_LABELS={owner:'Proprietário',admin:'Admin',user:'Usuário'}
function RoleBadge({role}){const c=ROLE_COLORS[role]||ROLE_COLORS.user;return <span style={{...S.badge,background:c.bg,color:c.color}}>{ROLE_LABELS[role]||role}</span>}
function Field({label,value,onChange,placeholder,type='text',mt,onEnter}){return (<div style={{marginBottom:14,marginTop:mt?4:0}}><label style={S.label}>{label}</label><input style={S.input} type={type} value={value} onChange={e=>onChange(e.target.value)} onKeyDown={e=>e.key==='Enter'&&onEnter&&onEnter()} placeholder={placeholder}/></div>)}
function EsqueciSenha({onClose}){const [email,setEmail]=useState('');const [enviando,setEnviando]=useState(false);const [enviado,setEnviado]=useState(false);const enviar=async()=>{if(!email.trim()) return;setEnviando(true);try{ await db.esqueciSenha(email.trim().toLowerCase()) }catch{};setEnviando(false);setEnviado(true)};return (<div style={S.modal} onClick={e=>e.target===e.currentTarget&&onClose()}><div className="cb-modal-box" style={{maxWidth:380}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><span style={{fontSize:13,fontWeight:700,color:'#f0c040',letterSpacing:2}}>ESQUECI MINHA SENHA</span><button style={S.btnS} onClick={onClose}>✕</button></div>{enviado?(<div style={S.okBox}>Se o e-mail existir em nossa base, o administrador foi notificado e vai te passar uma nova senha.</div>):(<><p style={{fontSize:12,color:'#a0a8c0',marginBottom:14,lineHeight:1.6}}>Informe seu e-mail. O administrador do sistema vai ser avisado e vai te passar uma nova senha temporária.</p><Field label="E-mail" value={email} onChange={setEmail} type="email" placeholder="seu@email.com" onEnter={enviar}/><button style={{...S.btnP,marginTop:14,opacity:enviando?0.6:1}} onClick={enviar} disabled={enviando}>{enviando?'Enviando...':'Solicitar troca de senha'}</button></>)}</div></div>)}
function Login({onLogin}){const [email,setEmail]=useState('');const [senha,setSenha]=useState('');const [erro,setErro]=useState('');const [loading,setLoading]=useState(false);const [showEsqueci,setShowEsqueci]=useState(false);const ok=async()=>{ setErro('');setLoading(true); try{await onLogin(email.trim().toLowerCase(),senha)}catch{setErro('E-mail ou senha incorretos.')} setLoading(false) };return (<div style={S.center}><div style={{width:'100%',maxWidth:400}}><div className="cb-logo-wrap"><img className="cb-logo-emerge" src="/brand/dragon-logo.png" alt="" onError={e=>{e.target.style.display='none'}}/></div><div className="cb-neon-wrap"><div className="cb-neon-inner" style={S.box}><div style={{width:'fit-content',margin:'0 auto 18px',background:'rgba(255,255,255,0.95)',borderRadius:8,padding:'8px 14px'}}><img src="/brand/logo-full.webp" alt="Atualcargas" style={{height:26,display:'block'}} onError={e=>{e.target.parentElement.style.display='none'}}/></div><div style={S.logoT}>Cubagens</div><div style={S.logoS}>BLUMENAU · SISTEMA DE CARGAS</div><Field label="E-mail" value={email} onChange={setEmail} type="email" placeholder="seu@email.com" onEnter={ok}/><Field label="Senha" value={senha} onChange={setSenha} type="password" placeholder="••••••" mt onEnter={ok}/>{erro && <div style={S.errBox}>{erro}</div>}<button style={{...S.btnP,marginTop:20,opacity:loading?0.6:1}} onClick={ok} disabled={loading}>{loading?'Entrando...':'Entrar'}</button><div style={{textAlign:'center',marginTop:14}}><span style={{fontSize:11,color:'#6b7280',cursor:'pointer',textDecoration:'underline'}} onClick={()=>setShowEsqueci(true)}>Esqueci minha senha</span></div></div></div></div>{showEsqueci&&<EsqueciSenha onClose={()=>setShowEsqueci(false)}/>}</div>)}
function TrocaSenha({obrigatoria,onClose,onSave}){const [s1,setS1]=useState('');const [s2,setS2]=useState('');const [erro,setErro]=useState('');const [salvando,setSalvando]=useState(false);const valida=()=>{ if(s1.length<8) return 'A senha deve ter no mínimo 8 caracteres.'; if(s1!==s2) return 'As senhas não coincidem.'; return '' };const ok=async()=>{ const v=valida(); setErro(v); if(v) return; setSalvando(true); try{ await onSave(s1) }catch(e){ setErro(e.message) }; setSalvando(false) };const campos=(<><Field label="Nova senha" value={s1} onChange={setS1} type="password" placeholder="mín. 8 caracteres" onEnter={ok}/><Field label="Confirmar nova senha" value={s2} onChange={setS2} type="password" placeholder="repita a senha" mt onEnter={ok}/>{erro&&<div style={S.errBox}>{erro}</div>}<div style={{display:'flex',gap:8,marginTop:20}}>{!obrigatoria&&<button style={{...S.btnS,flex:1}} onClick={onClose}>Cancelar</button>}<button style={{...S.btnP,flex:2,opacity:salvando?0.6:1}} onClick={ok} disabled={salvando}>{salvando?'Salvando...':'Salvar senha'}</button></div></>);if(obrigatoria) return (<div style={S.center}><div style={S.box}><div style={S.logoT}>Nova senha</div><div style={S.logoS}>DEFINA UMA SENHA DEFINITIVA PARA CONTINUAR</div>{campos}</div></div>);return (<div style={S.modal} onClick={e=>e.target===e.currentTarget&&onClose&&onClose()}><div className="cb-modal-box" style={{maxWidth:400}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><span style={{fontSize:13,fontWeight:700,color:'#f0c040',letterSpacing:2}}>ALTERAR SENHA</span><button style={S.btnS} onClick={onClose}>✕</button></div>{campos}</div></div>)}

function Dashboard({frotas,onFrota}){const [stats,setStats]=useState(null);useEffect(()=>{ let ativo=true; db.listarRegistrosPorPeriodo(todayStr(),todayStr()).then(regs=>{ if(!ativo) return; const m3Hoje=regs.reduce((s,r)=>s+(parseFloat(r.m3_total)||0),0); const volHoje=regs.reduce((s,r)=>s+(parseInt(r.qtd_total)||0),0); setStats({ cubagens:regs.length, m3:m3Hoje, volumes:volHoje }) }).catch(()=>setStats({cubagens:0,m3:0,volumes:0})); return ()=>{ativo=false} },[]);return (<div className="cb-page"><h1 style={{fontSize:18,fontWeight:700,color:'#f0c040',letterSpacing:2,marginBottom:4}}>CUBAGENS BLUMENAU</h1><p style={{fontSize:11,color:'#6b7280',marginBottom:20}}>{new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase()}</p><div className="cb-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',marginBottom:24}}><MetricCard label="Cubagens hoje" valor={stats?stats.cubagens:'—'}/><MetricCard label="M³ total hoje" valor={stats?stats.m3.toFixed(2):'—'} cor="#f0c040"/><MetricCard label="Volumes hoje" valor={stats?stats.volumes:'—'}/><MetricCard label="Frotas ativas" valor={(frotas||[]).length}/></div><div style={S.secT}>Selecionar frota</div><div className="cb-grid">{(frotas||[]).map(f=>(<div key={f.id} className="cb-frota-btn" onClick={()=>onFrota(f)}><div style={{fontSize:10,color:'#6b7280',letterSpacing:2,marginBottom:6}}>FROTA</div><div style={{fontSize:16,fontWeight:700,color:'#e8eaf0',letterSpacing:2}}>{f.placa}</div><div style={{marginTop:10,fontSize:11,color:'#f0c040'}}>→ lançar cubagem</div></div>))}{(!frotas||frotas.length===0)&&<p style={{color:'#6b7280',fontSize:13}}>Nenhuma frota cadastrada.</p>}</div></div>)}
function GrupoMedida({grupo,index,total,onChange,onRemove}){const isM=grupo.unidade!=='mm';const step=isM?0.01:1;const toM=v=>isM?parseFloat(v)||0:(parseFloat(v)||0)/1000;const m3g=toM(grupo.largura)*toM(grupo.altura)*toM(grupo.comprimento)*(parseInt(grupo.qtd)||0);return (<div style={{background:'#0f1117',border:'1px solid #2a3050',borderRadius:10,padding:14,marginBottom:10}}><div style={{display:'flex',alignItems:'center',marginBottom:12,gap:8,flexWrap:'wrap'}}><span style={{fontSize:11,color:'#6b7280',letterSpacing:2,fontWeight:700}}>GRUPO {index+1}</span><div style={{display:'flex',gap:3,marginLeft:8}}>{['m','mm'].map(u=>(<button key={u} style={{...S.btnS,padding:'2px 8px',fontSize:11,borderColor:grupo.unidade===u?'#f0c040':'#2a3050',color:grupo.unidade===u?'#f0c040':'#6b7280'}} onClick={()=>onChange(grupo.id,'unidade',u)}>{u}</button>))}</div>{total>1&&<button style={{...S.btnD,padding:'2px 8px',fontSize:11,marginLeft:'auto'}} onClick={()=>onRemove(grupo.id)}>✕</button>}</div><div style={{marginBottom:12}}><label style={S.label}>Qtd. volumes neste grupo</label><input style={S.input} type="number" min="1" value={grupo.qtd} onChange={e=>onChange(grupo.id,'qtd',e.target.value)} placeholder="Ex: 15"/></div>{[{k:'altura',l:'Altura'},{k:'largura',l:'Largura'},{k:'comprimento',l:'Comprimento'}].map(({k,l})=>(<div key={k} style={{marginBottom:12}}><label style={S.label}>{l} ({grupo.unidade})</label><input style={S.input} type="number" min={step} step={step} value={grupo[k]} onChange={e=>onChange(grupo.id,k,e.target.value)} placeholder={isM?'0.00':'0'}/></div>))}{grupo.qtd&&grupo.largura&&grupo.altura&&grupo.comprimento&&(<div style={{padding:'7px 10px',background:'#1a1f2e',borderRadius:6,display:'flex',justifyContent:'space-between',fontSize:13}}><span style={{color:'#6b7280'}}>M³ deste grupo</span><b style={{color:'#f0c040'}}>{m3g.toFixed(4)} m³</b></div>)}</div>)}
function GruposDetalhe({grupos}){if(!grupos||grupos.length===0) return <span style={{color:'#6b7280'}}>—</span>;return (<div style={{display:'flex',flexDirection:'column',gap:4}}>{grupos.map((g,i)=>{ const a=g.altura_m??0,l=g.largura_m??0,c=g.comprimento_m??0; return (<div key={g.id||i} style={{background:'#0f1117',borderRadius:5,padding:'4px 8px',fontSize:10,lineHeight:1.8}}><span style={{color:'#f0c040',fontWeight:700}}>G{i+1}</span><span style={{color:'#6b7280',marginLeft:5}}>{g.qtd}vol</span><span style={{color:'#e8eaf0',marginLeft:5}}>A:{fmtDim(a)} L:{fmtDim(l)} C:{fmtDim(c)}</span><span style={{color:'#40c080',marginLeft:5}}>{(a*l*c*(parseInt(g.qtd)||0)).toFixed(4)}m³</span></div>)})}</div>)}
function TabelaRegistros({registros,onEdit,onDelete}){return (<div className="cb-table-wrap"><table style={S.table}><thead><tr><th style={S.th}>Data</th><th style={S.th}>Frota</th><th className="cb-hide-mobile" style={S.th}>Usuário</th><th style={S.th}>Cliente</th><th style={S.th}>Nota</th><th className="cb-hide-mobile" style={S.th}>Vol.</th><th className="cb-hide-mobile" style={S.th}>Medidas</th><th style={S.th}>M³</th><th style={S.th}>Status</th>{(onEdit||onDelete)&&<th style={S.th}>Ações</th>}</tr></thead><tbody>{registros.map(r=>(<tr key={r.id} style={{background:r.editado?'rgba(240,192,64,0.04)':'transparent'}}><td style={{...S.td,fontSize:10,whiteSpace:'nowrap'}}>{fmtDate(r.criado_em)}</td><td style={{...S.td,fontWeight:700,color:'#f0c040',whiteSpace:'nowrap'}}>{r.frota_placa}</td><td className="cb-hide-mobile" style={{...S.td,fontSize:10,color:'#6b7280'}}>{r.user_email}</td><td style={S.td}>{r.cliente}</td><td style={S.td}>{r.nota}</td><td className="cb-hide-mobile" style={{...S.td,textAlign:'center'}}>{r.qtd_total}</td><td className="cb-hide-mobile" style={S.td}><GruposDetalhe grupos={r.grupos}/></td><td style={{...S.td,fontWeight:700,whiteSpace:'nowrap'}}>{parseFloat(r.m3_total).toFixed(4)}</td><td style={S.td}><span style={{...S.badge,background:r.editado?'#2a2010':'#0f2a1a',color:r.editado?'#f0c040':'#40c080'}}>{r.editado?'edit':'ok'}</span></td>{(onEdit||onDelete)&&(<td style={S.td}><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{onEdit&&<button style={{...S.btnS,padding:'3px 7px',fontSize:11}} onClick={()=>onEdit(r)}>✎</button>}{onDelete&&<button style={{...S.btnD,padding:'3px 7px',fontSize:11}} onClick={()=>onDelete(r)}>🗑</button>}</div></td>)}</tr>))}</tbody></table></div>)}
function DateGroupedTable({registros,onEdit,onDelete}){const hoje=registros.filter(r=>isToday(r.criado_em));const anteriores=registros.filter(r=>!isToday(r.criado_em));const Label=({cor,dot,label,count})=>(<div style={{display:'flex',alignItems:'center',gap:8,margin:'12px 0 6px'}}><span style={{fontSize:11,color:cor,letterSpacing:2,fontWeight:700}}>{dot} {label}</span><span style={{...S.badge,background:cor==='#40c080'?'#0f2a1a':'#1a1f2e',color:cor}}>{count} reg.</span></div>);if(registros.length===0) return <p style={{color:'#6b7280',fontSize:13,marginTop:8}}>Nenhum registro.</p>;return (<div>{hoje.length>0&&<><Label cor="#40c080" dot="●" label="HOJE" count={hoje.length}/><TabelaRegistros registros={hoje} onEdit={onEdit} onDelete={onDelete}/></>}{anteriores.length>0&&<><Label cor="#6b7280" dot="○" label="ANTERIORES" count={anteriores.length}/><TabelaRegistros registros={anteriores} onEdit={onEdit} onDelete={onDelete}/></>}</div>)}

function ModalEdicao({reg,perfil,onClose,onSave}){const [step,setStep]=useState('motivo');const [motivo,setMotivo]=useState('');const [grupos,setGrupos]=useState((reg.grupos||[]).map(g=>({...g,id:g.id||uid(),unidade:g.unidade||'m',altura:String(g.altura_m??0),largura:String(g.largura_m??0),comprimento:String(g.comprimento_m??0)})));const upG=(id,f,v)=>setGrupos(gs=>gs.map(g=>g.id===id?{...g,[f]:v}:g));return (<div style={S.modal} onClick={e=>e.target===e.currentTarget&&onClose()}><div className="cb-modal-box"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><span style={{fontSize:13,fontWeight:700,color:'#f0c040',letterSpacing:2}}>EDITAR CUBAGEM</span><button style={S.btnS} onClick={onClose}>✕</button></div><div style={{fontSize:12,color:'#6b7280',marginBottom:14}}>Nota <b style={{color:'#e8eaf0'}}>{reg.nota}</b> · {reg.cliente} · <b style={{color:'#f0c040'}}>{reg.frota_placa}</b></div>{step==='motivo'?(<><label style={S.label}>Motivo da edição (mín. 10 chars)</label><textarea style={{...S.input,minHeight:80,resize:'vertical'}} value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder="Descreva o motivo..."/><div style={{fontSize:11,color:motivo.length>=10?'#40c080':'#6b7280',marginTop:4}}>{motivo.length}/10</div><button style={{...S.btnY,width:'100%',marginTop:12,opacity:motivo.length>=10?1:0.4}} disabled={motivo.length<10} onClick={()=>setStep('editar')}>Continuar →</button></>):(<><div style={S.secT}>Grupos de medidas</div>{grupos.map((g,i)=><GrupoMedida key={g.id} grupo={g} index={i} total={grupos.length} onChange={upG} onRemove={()=>{}}/>)}<div style={{padding:'9px 12px',background:'#0f1117',borderRadius:8,fontSize:13,marginBottom:12}}>M³ total: <b style={{color:'#f0c040'}}>{calcM3(grupos).toFixed(4)}</b></div><div style={{display:'flex',gap:8}}><button style={{...S.btnS,flex:1}} onClick={()=>setStep('motivo')}>← Voltar</button><button style={{...S.btnY,flex:2}} onClick={()=>onSave(reg.id,grupos,motivo)}> function FrotaView({frota,clientes,session,perfil,onBack,showToast}){const def={cliente:'',clienteSearch:'',nota:'',qtdTotal:'',grupos:[novoGrupo()]};const [form,setForm]=useState(def);const [showCli,setShowCli]=useState(false);const [erros,setErros]=useState([]);const [editReg,setEditReg]=useState(null);const [confirmDel,setConfirmDel]=useState(null);const [salvando,setSalvando]=useState(false);const [dataIni,setDataIni]=useState(todayStr());const [dataFim,setDataFim]=useState(todayStr());const [regF,setRegF]=useState([]);const [carregandoReg,setCarregandoReg]=useState(true);const up=p=>setForm(f=>({...f,...p}));const clisF=(clientes||[]).filter(c=>c.nome.toLowerCase().includes((form.clienteSearch||'').toLowerCase()));const soma=form.grupos.reduce((s,g)=>s+(parseInt(g.qtd)||0),0);const m3T=calcM3(form.grupos);const recarregar=useCallback(async()=>{ setCarregandoReg(true); try{ setRegF(await db.listarRegistrosPorPeriodo(dataIni,dataFim,frota.id)) }catch(e){ showToast('Erro ao carregar lançamentos: '+e.message,'err') }; setCarregandoReg(false) },[dataIni,dataFim,frota.id]);useEffect(()=>{ recarregar() },[recarregar]);const salvar=async()=>{ const err=[]; if(!form.cliente) err.push('Selecione um cliente.'); if(!form.nota.trim()) err.push('Informe a nota fiscal.'); if(!form.qtdTotal||parseInt(form.qtdTotal)<1) err.push('Informe a quantidade total de volumes.'); if(soma!==parseInt(form.qtdTotal)) err.push(`Soma dos grupos (${soma}) ≠ total (${form.qtdTotal}).`); form.grupos.forEach((g,i)=>{ if(!g.qtd||!g.altura||!g.largura||!g.comprimento) err.push(`Grupo ${i+1}: preencha todos os campos.`) }); setErros(err); if(err.length) return; setSalvando(true); try { const gruposComDims=form.grupos.map(g=>({...g,...dimsM(g)})); await db.salvarRegistro({frotaId:frota.id,frotaPlaca:frota.placa,cliente:form.cliente,nota:form.nota,qtdTotal:parseInt(form.qtdTotal),m3Total:m3T},gruposComDims,session,perfil); setForm(def);setErros([]);showToast(`Nota ${form.nota} salva! ${m3T.toFixed(4)}  onChange={e=>up({nota:e.target.value})} placeholder="Ex: 2026"/></div><div style={{flex:1,minWidth:90}}><label style={S.label}>Qtd. volumes</label><input style={S.input} type="number" min="1" value={form.qtdTotal} onChange={e=>up({qtdTotal:e.target.value})} placeholder="40"/></div></div><div style={S.secT}>Grupos de medidas</div>{form.grupos.map((g,i)=>(<GrupoMedida key={g.id} grupo={g} index={i} total={form.grupos.length} onChange={(id,f,v)=>up({grupos:form.grupos.map(x=>x.id===id?{...x,[f]:v}:x)})} onRemove={id=>up({grupos:form.grupos.filter(x=>x.id!==id)})}/>))}<div className="cb-row" style={{marginTop:10,alignItems:'center'}}><button style={S.btnS} onClick={()=>up({grupos:[...form.grupos,novoGrupo()]})}>+ Grupo</button><span style={{fontSize:12,color:soma===parseInt(form.qtdTotal)&&form.qtdTotal?'#40c080':'#f0c040'}}>Vol: {soma}/{form.qtdTotal||'?'}</span><span style={{marginLeft:'auto',fontSize:13}}>M³: <b style={{color:'#f0c040'}}>{m3T.toFixed(4)}</b></span></div>{erros.length>0&&<div style={S.errBox}>{erros.map((e,i)=><div key={i}>• {e}</div>)}</div>}<button style={{...S.btnY,marginTop:14,width:'100%',opacity:salvando?0.6:1}} onClick={salvar} disabled={salvando}>{salvando?'Salvando...':'Salvar cubagem'}</button></div><div className="cb-card"><div style={S.secT}>Lançamentos desta frota</div><div className="cb-row" style={{marginBottom:12,alignItems:'center'}}><div><label style={S.label}>De</label><input style={S.input} type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)}/></div><div><label style={S.label}>Até</label><input style={S.input} type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)}/></div><button style={{...S.btnS,marginTop:18}} onClick={()=>{setDataIni(todayStr());setDataFim(todayStr())}}>Hoje</button></div>{carregandoReg?<p style={{color:'#6b7280',fontSize:13}}>Carregando...</p>:regF.length>0?<DateGroupedTable registros={regF} onEdit={setEditReg} onDelete={isAdmin(perfil)?setConfirmDel:null}/>:<p style={{color:'#6b72 function AdminView({perfil,session,frotas,setFrotas,clientes,setClientes,showToast,onSolicitacoesAtualizadas}){const [tab,setTab]=useState('frotas');const [np,setNp]=useState('');const [nc,setNc]=useState('');const [usuarios,setUsuarios]=useState([]);const defNovoUsr={nome:'',email:'',senha:'',role:'user'};const [novoUsr,setNovoUsr]=useState(defNovoUsr);const [criandoUsr,setCriandoUsr]=useState(false);const [redefinirUsr,setRedefinirUsr]=useState(null);const [novaSenhaRedef,setNovaSenhaRedef]=useState('');const [redefinindo,setRedefinindo]=useState(false);const [excluirUsr,setExcluirUsr]=useState(null);const [excluindo,setExcluindo]=useState(false);const recarregarUsuarios=()=>db.listarUsuarios().then(setUsuarios).catch(()=>{});useEffect(()=>{ if(tab==='usuarios') recarregarUsuarios() },[tab]);const gerarSenha=()=>{ const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<10;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s };const criarUsuario=async()=>{ if(!novoUsr.nome.trim()||!novoUsr.email.trim()||novoUsr.senha.length<8){ showToast('Preencha nome, e-mail e uma senha com 8+ caracteres.','err'); return }; setCriandoUsr(true); try{ await db.criarUsuario({nome:novoUsr.nome.trim(),email:novoUsr.email.trim().toLowerCase(),senha:novoUsr.senha,role:novoUsr.role},session.access_token); showToast(`Usuário ${novoUsr.nome} criado! Senha temporária: ${novoUsr.senha}`); setNovoUsr(defNovoUsr); recarregarUsuarios() }catch(e){ showToast('Erro: '+e.message,'err') }; setCriandoUsr(false) };const confirmarRedefinicao=async()=>{ if(novaSenhaRedef.length<8){ showToast('A senha deve ter no mínimo 8 caracteres.','err'); return }; setRedefinindo(true); try{ await db.redefinirSenha(redefinirUsr.id,novaSenhaRedef,session.access_token); showToast(`Senha de ${redefinirUsr.nome} redefinida! Nova senha: ${novaSenhaRedef}`); setRedefinirUsr(null);setNovaSenhaRedef(''); recarregarUsuarios(); onSolicitacoesAtualizadas&&onSolicitacoesAtualizadas() }catch(e){ showToast('Erro: '+e.message,'err') }; setRedefinindo(false) };const confirmarExclusao=async()=>{ setExcluindo(true); try{ await db.excluirUsuario(excluirUsr.id,session.access_token); showToast(`${excluirUsr.nome} excluído.`,'err'); setExcluirUsr(null); recarregarUsuarios(); onSolicitacoesAtualizadas&&onSolicitacoesAtualizadas() }catch(e){ showToast('Erro: '+e.message,'err') }; setExcluindo(false) };const pendentes=(usuarios||[]).filter(u=>u.solicitou_reset_senha).length;return (<div className="cb-page"><h1 style={{fontSize:16,fontWeight:700,color:'#f0c040',letterSpacing:2,marginBottom:18}}>PAINEL ADMIN</h1><div style={S.tabs}>{[['frotas','Frotas'],['clientes','Clientes'],['usuarios','Usuários']].map(([k,l])=>(<button key={k} style={{...S.tab,background:tab===k?'#f0c040':'transparent',color:tab===k?'#0f1117':'#6b7280'}} onClick={()=>setTab(k)}>{l}</button>))}</div>{tab==='frotas'&&(<div className="cb-card"><div style={S.secT}>Frotas</div><div className="cb-row" style={{marginBottom:12}}><input style={{...S.input,maxWidth:200}} value={np} onChange={e=>setNp(e.target.value.toUpperCase())} placeholder="Ex: ABC1234" maxLength={8}/><button style={S.btnY} onClick={async()=>{ if(!np.trim()) return; try{const f=await db.adicionarFrota(np.trim());setFrotas(p=>[...p,f]);setNp('');showToast('Frota adicionada!')}catch(e){showToast(e.message,'err')} }}>+ Adicionar</button></div><div className="cb-table-wrap"><table style={S.table}><thead><tr><th style={S.th}>Placa</th><th style={S.th}>Ação</th></tr></thead><tbody>{(frotas||[]).map(f=>(<tr key={f.id}><td style={{...S.td,fontWeight:700}}>{f.placa}</td><td style={S.td}><button style={S.btnD} onClick={async()=>{ try{await db.removerFrota(f.id);setFrotas(p=>p.filter(x=>x.id!==f.id));showToast('Removida.','err')}catch(e){showToast(e.message,'err')} }}>Remover</button></td></tr>))}</tbody></table></div></div>)}{tab==='clientes'&&(<div className="cb-card"><div style={S.secT}>Clientes</div><div className="cb-row" style={{ e={e=>setNovoUsr(u=>({...u,role:e.target.value}))}><option value="user">Usuário</option><option value="admin">Admin</option></select></div></div><div className="cb-field-row"><div style={{flex:1,minWidth:160}}><label style={S.label}>Senha temporária</label><div style={{display:'flex',gap:6}}><input style={S.input} value={novoUsr.senha} onChange={e=>setNovoUsr(u=>({...u,senha:e.target.value}))} placeholder="mín. 8 caracteres"/><button style={S.btnS} onClick={()=>setNovoUsr(u=>({...u,senha:gerarSenha()}))}>Gerar</button></div></div></div><div style={{fontSize:11,color:'#6b7280',marginBottom:10}}>O usuário será obrigado a trocar essa senha no primeiro acesso.</div><button style={{...S.btnY,opacity:criandoUsr?0.6:1}} onClick={criarUsuario} disabled={criandoUsr}>{criandoUsr?'Criando...':'+ Criar usuário'}</button></div>)}<div className="cb-table-wrap"><table style={S.table}><thead><tr><th style={S.th}>Nome</th><th className="cb-hide-mobile" style={S.th}>E-mail</th><th style={S.th}>Perfil</th>{isOwner(perfil)&&<th style={S.th}>Ações</th>}</tr></thead><tbody>{(usuarios||[]).map(u=>(<tr key={u.id} style={{background:u.solicitou_reset_senha?'rgba(240,192,64,0.08)':'transparent'}}><td style={S.td}>{u.nome}{u.solicitou_reset_senha&&<div style={{...S.badge,background:'#2a2010',color:'#f0c040',marginTop:4}}>🔔 pediu troca de senha</div>}</td><td className="cb-hide-mobile" style={S.td}>{u.email}</td><td style={S.td}><RoleBadge role={u.role}/></td>{isOwner(perfil)&&(<td style={S.td}><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{u.email!==OWNER_EMAIL&&u.role!=='owner'&&(<>{u.role==='admin'?<button style={{...S.btnS,fontSize:11}} onClick={async()=>{await db.atualizarRole(u.id,'user');setUsuarios(p=>p.map(x=>x.id===u.id?{...x,role:'user'}:x));showToast(`${u.nome} rebaixado.`)}}>↓ User</button>:<button style={{...S.btnS,fontSize:11,borderColor:'#c080ff',color:'#c080ff'}} onClick={async()=>{await db.atualizarRole(u.id,'admin');setUsuarios(p=>p.map(x=>x.id===u.id?{...x,role:'admin'}:x));showToast(`${u.nome} promovido!`)}}>↑ Admin</button>}<button style={{...S.btnS,fontSize:11,borderColor:'#f0c040',color:'#f0c040'}} onClick={()=>{setRedefinirUsr(u);setNovaSenhaRedef(gerarSenha())}}>🔑 Redefinir</button><button style={{...S.btnD,fontSize:11}} onClick={()=>setExcluirUsr(u)}>Excluir</button></>)}</div></td>)}</tr>))}</tbody></table></div></div>)}{redefinirUsr&&(<div style={S.modal} onClick={e=>e.target===e.currentTarget&&setRedefinirUsr(null)}><div className="cb-modal-box" style={{maxWidth:380}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><span style={{fontSize:13,fontWeight:700,color:'#f0c040',letterSpacing:2}}>REDEFINIR SENHA</span><button style={S.btnS} onClick={()=>setRedefinirUsr(null)}>✕</button></div><p style={{fontSize:12,color:'#a0a8c0',marginBottom:14}}>Nova senha temporária para <b style={{color:'#e8eaf0'}}>{redefinirUsr.nome}</b>. Ele será obrigado a trocá-la no próximo login.</p><div style={{display:'flex',gap:6}}><input style={S.input} value={novaSenhaRedef} onChange={e=>setNovaSenhaRedef(e.target.value)} placeholder="mín. 8 caracteres"/><button style={S.btnS} onClick={()=>setNovaSenhaRedef(gerarSenha())}>Gerar</button></div><div style={{display:'flex',gap:8,marginTop:20}}><button style={{...S.btnS,flex:1}} onClick={()=>setRedefinirUsr(null)}>Cancelar</button><button style={{...S.btnY,flex:2,opacity:redefinindo?0.6:1}} onClick={confirmarRedefinicao} disabled={redefinindo}>{redefinindo?'Salvando...':'Confirmar'}</button></div></div></div>)}{excluirUsr&&(<div style={S.modal} onClick={e=>e.target===e.currentTarget&&setExcluirUsr(null)}><div className="cb-modal-box" style={{maxWidth:380}}><div style={{fontSize:14,fontWeight:700,color:'#e05050',marginBottom:14}}>⚠️ EXCLUIR USUÁRIO</div><div style={{fontSize:13,color:'#a0a8c0',lineHeight:2,marginBottom:18}}>Excluir <b style={{color:'#e8eaf0'}}>{excluirUsr.nome}</b> ({excluirUsr.email})?<br/><span style={{color:'#e05050'}}>O acesso dele ao sistema será removido imediatamente. Esta ação não pode ser desfeita.</span></div><div style={{display:'flex',gap:8}}><button style={{...S.btnS,flex:1}} onClick={()=>setExcluirUsr(null)}>Cancelar</button><button style={{...S.btnD,flex:1,background:'#2a1515',fontWeight:700,opacity:excluindo?0.6:1}} onClick={confirmarExclusao} disabled={excluindo}>{excluindo?'Excluindo...':'Confirmar'}</button></div></div></div>)}</div>)}
function Historico({frotas,perfil,showToast}){const [editReg,setEditReg]=useState(null);const [confirmDel,setConfirmDel]=useState(null);const [filtroFrota,setFiltroFrota]=useState('');const [filtroNota,setFiltroNota]=useState('');const [dataIni,setDataIni]=useState(todayStr());const [dataFim,setDataFim]=useState(todayStr());const [registros,setRegistros]=useState([]);const [carregando,setCarregando]=useState(true);const recarregar=useCallback(async()=>{ setCarregando(true); try{ setRegistros(await db.listarRegistrosPorPeriodo(dataIni,dataFim,filtroFrota||null)) }catch(e){ showToast('Erro ao carregar histórico: '+e.message,'err') }; setCarregando(false) },[dataIni,dataFim,filtroFrota]);useEffect(()=>{ recarregar() },[recarregar]);const lista=[...(registros||[])].filter(r=>!filtroNota||r.nota.toLowerCase().includes(filtroNota.toLowerCase())).sort((a,b)=>new Date(b.criado_em)-new Date(a.criado_em));const handleDelete=async id=>{ try{await db.deletarRegistro(id);setConfirmDel(null);showToast('Cubagem excluída.','err');await recarregar()}catch(e){showToast('Erro: '+e.message,'err')} };const handleEdit=async(id,grupos,motivo)=>{ const m3=calcM3(grupos); try{await db.editarRegistro(id,grupos.map(g=>({...g,...dimsM(g)})),motivo,m3,perfil);setEditReg(null);showToast('Cubagem atualizada!');await recarregar()}catch(e){showToast('Erro: '+e.message,'err')} };const downloadCSV=()=>{ const BOM='\uFEFF'; const header=['ID','Frota','Data','Usuário','Cliente','Nota','Vol.Total','Grupo','Vol.Grupo','Alt(m)','Larg(m)','Comp(m)','M³Grupo','M³Total','Status'].join(';'); const rows=[]; lista.forEach(r=>{ (r.grupos||[]).forEach((g,gi)=>{ const a=g.altura_m??0,l=g.largura_m??0,c=g.comprimento_m??0; rows.push([r.id,r.frota_placa,fmtDate(r.criado_em),r.user_email,r.cliente,r.nota,r.qtd_total,`G${gi+1}`,g.qtd,a.toFixed(3),l.toFixed(3),c.toFixed(3),(a*l*c*g.qtd).toFixed(4),parseFloat(r.m3_total).toFixed(4),r.editado?'EDITADO':'ORIGINAL'].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')) }) }); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([BOM+header+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8;'})); a.download=`cubagens_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a);a.click();document.body.removeChild(a); showToast('CSV baixado!') };return (<div className="cb-page"><div className="cb-sync-bar"><h1 style={{fontSize:16,fontWeight:700,color:'#f0c040',letterSpacing:2,flex:1,minWidth:100}}>HISTÓRICO</h1><button style={S.btnS} onClick={downloadCSV}>↓ CSV</button></div><div className="cb-card"><div className="cb-field-row" style={{marginBottom:12}}><div style={{minWidth:130}}><label style={S.label}>De</label><input style={S.input} type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)}/></div><div style={{minWidth:130}}><label style={S.label}>Até</label><input style={S.input} type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)}/></div><div style={{minWidth:120}}><label style={S.label}>Frota</label><select style={{...S.select,width:'100%'}} value={filtroFrota} onChange={e=>setFiltroFrota(e.target.value)}><option value="">Todas</option>{(frotas||[]).map(f=><option key={f.id} value={f.id}>{f.placa}</option>)}</select></div><div style={{flex:1,minWidth:140,position:'relative'}}><label style={S.label}>Buscar nota</label><input style={S.input} value={filtroNota} onChange={e=>setFiltroNota(e.target.value)} placeholder="Ex: 2026"/></div><button style={{...S.btnS,marginTop:18}} onClick={()=>{setDataIni(todayStr());setDataFim(todayStr())}}>Hoje</button></div>{carregando?<p style={{color:'#6b7280',fontSize:13}}>Carregando...</p>:<DateGroupedTable registros={lista} onEdit={setEditReg} onDelete={isAdmin(perfil)?setConfirmDel:null}/>}</div>{editReg&&<ModalEdicao reg={editReg} perfil={perfil} onClose={()=>setEditReg(null)} onSave={handleEdit}/>}{confirmDel&&<ModalConfirmDel reg={confirmDel} onConfirm={()=>handleDelete(confirmDel.id)} onCancel={()=>setConfirmDel(null)}/>}</div>)}
function App(){const [session,setSession]=useState(null);const [perfil,setPerfil]=useState(null);const [frotas,setFrotas]=useState([]);const [clientes,setClientes]=useState([]);const [view,setView]=useState('dashboard');const [frota,setFrota]=useState(null);const [toast,setToast]=useState(null);const [loading,setLoading]=useState(true);const [trocaSenhaVoluntaria,setTrocaSenhaVoluntaria]=useState(false);const [solicitacoesPendentes,setSolicitacoesPendentes]=useState(0);const showToast=(msg,type='ok')=>{ setToast({msg,type}); setTimeout(()=>setToast(null),3500) };const carregarDados=useCallback(async()=>{ const [f,c]=await Promise.all([db.listarFrotas(),db.listarClientes()]); setFrotas(f);setClientes(c) },[]);const atualizarBadgeSolicitacoes=useCallback(async(p)=>{ if(!isAdmin(p)) return; try{ setSolicitacoesPendentes(await db.contarSolicitacoesSenha()) }catch{} },[]);const [erroFatal,setErroFatal]=useState('');useEffect(()=>{ sb.auth.getSession().then(async({data:{session}})=>{ try{ if(session){setSession(session);const p=await db.getPerfil(session.user.id);setPerfil(p);await carregarDados();await atualizarBadgeSolicitacoes(p)} } catch(e){ setErroFatal(e.message||'Erro ao carregar sessão.') }; setLoading(false) }); const {data:{subscription}}=sb.auth.onAuthStateChange(async(event,session)=>{ try{ if(session){setSession(session);const p=await db.getPerfil(session.user.id);setPerfil(p);await carregarDados();await atualizarBadgeSolicitacoes(p)} else{setSession(null);setPerfil(null);setFrotas([]);setClientes([]);setView('dashboard');setFrota(null);setSolicitacoesPendentes(0)} }catch(e){ setErroFatal(e.message||'Erro ao carregar sessão.') } }); return ()=>subscription.unsubscribe() },[carregarDados,atualizarBadgeSolicitacoes]);if(erroFatal) return (<div style={S.center}><div style={S.box}><div style={{...S.logoT,color:'#e05050'}}>Erro ao carregar</div><div style={S.errBox}>{erroFatal}</div><button style={{...S.btnP,marginTop:16}} onClick={()=>{sb.auth.signOut();window.location.reload()}}>Sair e tentar de novo</button></div></div>);if(loading) return (<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f1117,#1a1f2e)'}}><div style={{textAlign:'center'}}><div style={{fontSize:22,fontWeight:700,color:'#f0c040',letterSpacing:2}}>CUBAGENS</div><div style={{fontSize:12,color:'#6b7280',letterSpacing:2,marginTop:10}}>CARREGANDO...</div></div></div>);if(!session) return <Login onLogin={(e,s)=>db.signIn(e,s)}/>;if(perfil?.deve_trocar_senha) return (<TrocaSenha obrigatoria onSave={async(novaSenha)=>{ await db.trocarSenha(novaSenha,session.user.id); setPerfil(p=>({...p,deve_trocar_senha:false})); showToast('Senha atualizada!') }}/>);return (<div style={{minHeight:'100vh',background:'#0f1117',color:'#e8eaf0',fontFamily:"'Inter',sans-serif"}}><nav className="cb-nav"><span className="cb-nav-title" style={{fontSize:13,fontWeight:700,color:'#f0c040',letterSpacing:2,flex:1}}>▣ CUBAGENS</span><span className="cb-nav-badge" style={{fontSize:11,color:'#6b7280'}}>{perfil?.nome}</span><span className="cb-nav-badge"><RoleBadge role={perfil?.role}/></span>{isAdmin(perfil)&&(<button style={{...S.btnS,position:'relative'}} onClick={()=>setView('admin')}>Admin{solicitacoesPendentes>0&&<span style={{position:'absolute',top:-6,right:-6,background:'#e05050',color:'#fff',borderRadius:10,fontSize:10,fontWeight:700,padding:'1px 5px',lineHeight:1.4}}>{solicitacoesPendentes}</span>}</button>)}<button style={S.btnS} onClick={()=>setView('historico')}>Histórico</button><button style={S.btnS} onClick={()=>{setView('dashboard');setFrota(null)}}>Início</button><button style={S.btnS} onClick={()=>setTrocaSenhaVoluntaria(true)}>Senha</button><button style={S.btnD} onClick={()=>db.signOut()}>Sair</button></nav>{trocaSenhaVoluntaria&&(<TrocaSenha onClose={()=>setTrocaSenhaVoluntaria(false)} onSave={async(novaSenha)=>{ await db.trocarSenha(novaSenha,session.user.id); setTrocaSenhaVoluntaria(false); showToast('Senha atualizada!') }}/>)}{toast&&(<div style={{position:'fixed',top:58,right:10,left:10,zIndex:300,padding:'10px 14px',borderRadius:8,fontSize:13,fontFamily:'inherit',background:toast.type==='ok'?'#0f2a1a':'#2a1515',border:`1px solid ${toast.type==='ok'?'#40c080':'#e05050'}`,color:toast.type==='ok'?'#40c080':'#e05050',maxWidth:380,marginLeft:'auto'}}>{toast.msg}</div>)}{view==='dashboard'&&<Dashboard frotas={frotas} onFrota={f=>{setFrota(f);setView('frota')}}/>}{view==='frota'&&frota&&<FrotaView frota={frota} clientes={clientes} session={session} perfil={perfil} onBack={()=>setView('dashboard')} showToast={showToast}/>}{view==='admin'&&isAdmin(perfil)&&<AdminView perfil={perfil} session={session} frotas={frotas} setFrotas={setFrotas} clientes={clientes} setClientes={setClientes} showToast={showToast} onSolicitacoesAtualizadas={()=>atualizarBadgeSolicitacoes(perfil)}/>}{view==='historico'&&<Historico frotas={frotas} perfil={perfil} showToast={showToast}/>}</div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
