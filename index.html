<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cubagens Blumenau</title>
<link rel="icon" type="image/png" href="/brand/dragon-logo.png"/>
<link rel="apple-touch-icon" href="/brand/dragon-logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{
  --bg:#011c44;--inset:#011a3f;--surface:#022a62;--surface-2:#012253;--surface-hi:#0b3c7c;
  --line:#0f4384;--line-soft:#0a3672;--fg:#eaf8ff;--fg-2:#b9d4ee;--muted:#8fb3d9;--faint:#6189b8;
  --accent:#0dd6fd;--accent-hi:#92effc;--accent-soft:rgba(13,214,253,.13);--ink:#02173f;--royal:#1383c0;
  --ok:#4ade80;--ok-soft:rgba(74,222,128,.13);--warn:#f5b84a;--warn-soft:rgba(245,184,74,.14);
  --crit:#ff6b78;--crit-soft:rgba(255,107,120,.14);--info:#5aa6ef;--info-soft:rgba(90,166,239,.16);
  --com:#5aa6ef;--com-soft:rgba(90,166,239,.16);
  --plate-white:#f3f5f7;--plate-blue:#0d3a8f;--plate-ink:#111318;--plate-edge:#9aa3b5;
  --f-display:'Space Grotesk','Inter',system-ui,sans-serif;--f-plate:'Saira Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;font-size:14px;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(ellipse 70% 45% at 85% 0%,rgba(13,214,253,.14),transparent 70%),linear-gradient(rgba(146,239,252,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(146,239,252,.05) 1px,transparent 1px);background-size:100% 100%,34px 34px,34px 34px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%)}
#root{min-height:100vh;position:relative;z-index:1}
.cb-brand{font-family:'Space Grotesk','Inter',sans-serif}
@keyframes cb-fade-up{from{opacity:0}to{opacity:1}}
.cb-view-enter{animation:cb-fade-up .28s ease-out both}
@keyframes cb-shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.cb-skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-hi) 37%,var(--surface) 63%);background-size:400px 100%;animation:cb-shimmer 1.4s ease-in-out infinite;border-radius:6px}
button{transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background-color .12s ease}
button:active{transform:scale(0.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important}
}
.cb-page{padding:20px 20px;max-width:2000px;margin:0 auto;width:100%}
.cb-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.cb-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;min-height:52px;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.cb-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cb-modal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;width:min(96vw,600px);max-height:92vh;overflow-y:auto}
.cb-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}
.cb-frota-btn{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:20px 14px;cursor:pointer;text-align:center;transition:border-color .15s;user-select:none}
.cb-frota-btn:hover,.cb-frota-btn:active{border-color:var(--accent)}
.cb-field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cb-sync-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
@media (max-width:768px){.cb-page{padding:12px 10px}.cb-card{padding:12px 12px}.cb-nav{padding:6px 10px;min-height:48px}.cb-grid{grid-template-columns:repeat(2,1fr);gap:8px}.cb-modal-box{padding:16px 12px}.cb-hide-mobile{display:none!important}.cb-field-row{flex-direction:column}.cb-field-row>*{width:100%!important;min-width:unset!important}table{font-size:11px}th,td{padding:5px 6px!important}}
@media (max-width:400px){.cb-grid{grid-template-columns:1fr 1fr}.cb-nav-title{font-size:11px!important}.cb-nav-badge{display:none}}
@media (min-width:1024px){.cb-page{padding:28px 24px}.cb-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.cb-neon-wrap{position:relative;border-radius:16px;padding:2px;overflow:hidden}
.cb-neon-wrap::before{content:'';position:absolute;inset:-40%;z-index:0;background:conic-gradient(from 0deg,transparent 0deg,transparent 260deg,var(--accent) 300deg,var(--accent-hi) 330deg,var(--accent) 345deg,transparent 360deg);animation:cb-neon-spin 3.5s linear infinite;filter:blur(1px)}
.cb-neon-inner{position:relative;z-index:1}
@keyframes cb-neon-spin{to{transform:rotate(360deg)}}
.cb-logo-wrap{position:relative;width:clamp(90px,28vw,150px);height:clamp(90px,28vw,150px);margin:0 auto 18px}
.cb-logo-wrap::before{content:'';position:absolute;inset:-15%;z-index:0;background:radial-gradient(closest-side,rgba(13,214,253,.55),transparent 72%);filter:blur(10px)}
.cb-logo-emerge{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;opacity:0;animation:cb-logo-emerge 1.1s ease-out forwards;transform:scale(.85)}
@keyframes cb-logo-emerge{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}

/* ===== Issue #13 — placas, mapa, comercial, conferente ===== */
.cb-num{font-variant-numeric:tabular-nums}
.cb-nav-btn[aria-current="page"]{border-color:var(--accent)!important;color:var(--accent)!important;background:var(--accent-soft)!important}
.cb-h1{font-family:var(--f-display);font-size:clamp(20px,2.2vw,26px);font-weight:600;letter-spacing:-.01em;color:var(--fg);text-wrap:balance}
.cb-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.cb-sub{color:var(--muted);margin-top:6px;max-width:72ch;font-size:13.5px;line-height:1.5}
.cb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.cb-label-row{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line);margin:26px 0 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cb-label-row span:last-child{color:var(--faint);letter-spacing:.06em}
/* Placa Mercosul */
.cb-plate{position:relative;width:100%;max-width:100%;aspect-ratio:40/13;background:var(--plate-white);border-radius:7px;border:2px solid var(--plate-edge);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 0 rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;container-type:inline-size}
.cb-plate-band{background:var(--plate-blue);height:24%;display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:#fff}
.cb-plate-band .ms{font-size:max(6px,3.4cqw);font-weight:700;letter-spacing:.06em;opacity:.85}
.cb-plate-band .br{font-family:var(--f-plate);font-weight:700;letter-spacing:.32em;font-size:max(8px,6cqw);padding-left:.32em}
.cb-flag{width:9cqw;aspect-ratio:10/7;background:#1f9a4a;position:relative;border-radius:1px}
.cb-flag::before{content:"";position:absolute;inset:12% 8%;background:#f6d10b;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.cb-flag::after{content:"";position:absolute;width:34%;aspect-ratio:1;border-radius:50%;background:#1a3a8f;left:33%;top:26%}
.cb-plate-chars{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--f-plate);font-weight:700;color:var(--plate-ink);font-size:21cqw;letter-spacing:.06em;line-height:1;padding-top:2%}
.cb-dock{width:100%;aspect-ratio:40/13;border-radius:7px;border:2px dashed #2a65a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);container-type:inline-size}
.cb-dock b{font-family:var(--f-display);font-size:clamp(14px,13cqw,30px);letter-spacing:.14em;color:var(--fg)}
.cb-dock small{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.cb-mini-plate{display:inline-flex;flex-direction:column;width:76px;border-radius:3px;border:1px solid var(--plate-edge);overflow:hidden;background:var(--plate-white);vertical-align:middle;flex:none}
.cb-mini-plate i{height:5px;background:var(--plate-blue)}
.cb-mini-plate span{font-family:var(--f-plate);font-weight:700;color:var(--plate-ink);font-size:14px;text-align:center;letter-spacing:.05em;line-height:1.25}
.cb-mini-dock{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);border:1px dashed #2a65a8;border-radius:3px;padding:3px 8px}
.cb-frotas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.cb-frota{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;cursor:pointer;color:var(--fg);font-family:inherit}
.cb-frota:hover{border-color:var(--accent);box-shadow:0 0 22px rgba(13,214,253,.18)}
.cb-frota-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.cb-frota-foot .go{color:var(--accent);font-weight:500}
.cb-frota-foot .pend{color:var(--muted)}
/* KPIs, chips, pills */
.cb-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cb-kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cb-kpi b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.cb-kpi small{color:var(--muted);font-size:12px}
.cb-chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit}
.cb-chip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:var(--accent-soft)}
.cb-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.cb-pill.com{background:var(--com-soft);color:var(--com)}.cb-pill.exp{background:var(--accent-soft);color:var(--accent)}
.cb-pill.ok{background:var(--ok-soft);color:var(--ok)}.cb-pill.warn{background:var(--warn-soft);color:var(--warn)}
.cb-pill.crit{background:var(--crit-soft);color:var(--crit)}.cb-pill.mute{background:var(--line-soft);color:var(--muted)}
/* Mapa */
.cb-split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.cb-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.cb-col{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cb-col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 6px}
.cb-col-h h3{font-size:13px;font-weight:600;font-family:var(--f-display);color:var(--fg)}
.cb-col-empty{font-size:12px;color:var(--faint);padding:8px 4px}
.cb-nfc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;cursor:pointer;color:var(--fg);font-family:inherit}
.cb-nfc:hover{border-color:#2a65a8}
.cb-nfc.a2{border-left-color:var(--warn)}.cb-nfc.a3{border-left-color:var(--crit)}
.cb-nfc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cb-nfc-top b{font-family:var(--f-display);font-weight:600;font-size:15px}
.cb-nfc-top span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cb-nfc.a2 .cb-nfc-top span{color:var(--warn)}.cb-nfc.a3 .cb-nfc-top span{color:var(--crit)}
.cb-nfc-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.cb-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.cb-panel h3{font-size:13px;font-family:var(--f-display);font-weight:600;margin-bottom:12px;color:var(--fg)}
.cb-uf-row{display:grid;grid-template-columns:34px 1fr 28px;gap:10px;align-items:center;font-size:12.5px;margin-bottom:8px}
.cb-uf-track{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;display:flex}
.cb-uf-track i{display:block;height:100%}
.cb-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.cb-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* Tabela comercial */
.cb-tbl{width:100%;border-collapse:collapse;min-width:820px}
.cb-tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.cb-tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-size:13px}
.cb-tbl tr:last-child td{border-bottom:0}
.cb-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cb-nfcell b{font-family:var(--f-display);font-weight:600;font-size:14.5px;display:block}
.cb-nfcell small{color:var(--muted);font-size:12px}
.cb-steps{display:flex;gap:4px}.cb-steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.cb-steps i.on{background:var(--com)}.cb-steps i.done{background:var(--ok)}
/* Drawer */
.cb-scrim{position:fixed;inset:0;background:rgba(1,12,32,.65);z-index:180;animation:cb-fade-up .2s ease-out both}
.cb-drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:190;display:flex;flex-direction:column;animation:cb-slide .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes cb-slide{from{transform:translateX(100%)}to{transform:none}}
.cb-dr-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cb-dr-head h2{font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--fg)}
.cb-dr-head p{margin-top:4px;color:var(--muted);font-size:13px}
.cb-dr-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:22px}
.cb-dr-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.cb-dr-foot small{color:var(--muted);font-size:12px;max-width:36ch}
.cb-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cb-fact{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;min-width:0}
.cb-fact small{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.cb-fact span{font-weight:600;overflow-wrap:anywhere;font-size:13px}
.cb-blk h4{font-size:13px;font-family:var(--f-display);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--fg)}
.cb-hint{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.cb-drop{border:1.5px dashed #2a65a8;border-radius:10px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background-color .15s}
.cb-drop.over,.cb-drop:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.cb-drop b{color:var(--fg);font-weight:600}
.cb-file{display:grid;grid-template-columns:auto 48px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:7px 9px}
.cb-file.sel{border-color:var(--ok)}
.cb-thumb{width:48px;height:48px;border-radius:6px;background:var(--line-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted)}
.cb-file b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-file small{color:var(--muted);font-size:11.5px}
.cb-proof{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--ink)}
.cb-proof img{display:block;width:100%;max-height:280px;object-fit:contain}
/* Conferente */
.cb-lanc{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.cb-lanc-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.cb-frota-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cb-frota-bar .cb-plate,.cb-frota-bar .cb-dock{width:190px}
.cb-frota-bar .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.cb-frota-bar .who small{color:var(--muted);font-size:12px}
.cb-frota-bar .who b{font-family:var(--f-display);font-size:17px;font-weight:600}
.cb-lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.cb-lcard-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cb-lcard-h h3{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--fg)}
.cb-nota-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.cb-big{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:0 12px;height:50px;font-size:18px;font-weight:600;width:100%;color:var(--fg);font-family:inherit;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s,box-shadow .15s}
.cb-big::placeholder{color:var(--faint);font-weight:500}
.cb-big:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cb-big.bad{border-color:var(--crit)}
.cb-grp{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:14px;animation:cb-fade-up .25s ease-out both}
.cb-grp-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cb-grp-h b{font-size:11px;letter-spacing:.14em;color:var(--accent-hi);font-weight:700}
.cb-grp-h .tools{margin-left:auto;display:flex;gap:6px}
.cb-unit{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px}
.cb-unit button{background:transparent;border:0;border-radius:5px;padding:3px 10px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit}
.cb-unit button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.cb-dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.cb-box-prev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-left:1px dashed var(--line);padding-left:14px;text-align:center}
.cb-box-prev svg{width:100%;max-width:110px;height:auto}
.cb-box-prev small{color:var(--muted);font-size:11px}

function parseNum(v){const n=parseFloat(String(v??'').trim().replace(',','.'));return isFinite(n)?n:0}

function calcM3(grupos){return grupos.reduce((s,g)=>{const t=v=>g.unidade==='mm'?parseNum(v)/1000:parseNum(v);return s+t(g.largura)*t(g.altura)*t(g.comprimento)*(parseInt(g.qtd)||0)},0)}

async uploadAnexo(file,pendenciaId,pasta){const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';const path=`${pendenciaId}/${pasta}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const {error}=await sb.storage.from('nf-anexos').upload(path,file,{contentType:file.type,upsert:false});if(error) throw error;return path},
async adicionarCotacao(pendenciaId,{numero,freteValor,file}){const path=file?await this.uploadAnexo(file,pendenciaId,'cotacoes'):null;const {error}=await sb.from('pendencias_cotacoes').insert({pendencia_id:pendenciaId,numero,frete_valor:freteValor,arquivo_path:path,arquivo_nome:file?file.name:null});if(error){if(path) await sb.storage.from('nf-anexos').remove([path]);throw error}},
async removerCotacao(c){const {error}=await sb.from('pendencias_cotacoes').delete().eq('id',c.id);if(error) throw error;if(c.arquivo_path) await sb.storage.from('nf-anexos').remove([c.arquivo_path])},
async buscarRegistrosPorCliente(cliente){if(!cliente) return [];const {data,error}=await sb.from('registros').select('*, grupos(*)').eq('cliente',cliente).order('criado_em',{ascending:false}).limit(30);if(error) throw error;return (data||[]).map(r=>({...r,grupos:(r.grupos||[]).sort((a,b)=>a.seq-b.seq)}))},
async criarPendencia(payload,grupos){const {data:p,error:e1}=await sb.from('pendencias_emissao').insert(payload).select().single();if(e1) throw e1;if(grupos&&grupos.length){const gd=grupos.map((g,i)=>({pendencia_id:p.id,seq:i+1,qtd:parseInt(g.qtd)||0,unidade:g.unidade||'m',altura_m:g.alturaM??0,largura_m:g.larguraM??0,comprimento_m:g.comprimentoM??0,m3_grupo:(g.alturaM??0)*(g.larguraM??0)*(g.comprimentoM??0)*(parseInt(g.qtd)||0)}));const {error:e2}=await sb.from('pendencias_emissao_grupos').insert(gd);if(e2) throw e2}return p},
async atualizarPendencia(id,patch){const {error}=await sb.from('pendencias_emissao').update(patch).eq('id',id);if(error) throw error},
async atualizarGruposPendencia(pendenciaId,grupos,m3Total){await sb.from('pendencias_emissao_grupos').delete().eq('pendencia_id',pendenciaId);const gd=grupos.map((g,i)=>({pendencia_id:pendenciaId,seq:i+1,qtd:parseInt(g.qtd)||0,unidade:g.unidade||'m',altura_m:g.alturaM??0,largura_m:g.larguraM??0,comprimento_m:g.comprimentoM??0,m3_grupo:(g.alturaM??0)*(g.larguraM??0)*(g.comprimentoM??0)*(parseInt(g.qtd)||0)}));if(gd.length){const {error}=await sb.from('pendencias_emissao_grupos').insert(gd);if(error) throw error}const qtdTotal=grupos.reduce((s,g)=>s+(parseInt(g.qtd)||0),0);await this.atualizarPendencia(pendenciaId,{qtd_volumes:qtdTotal,m3_total:m3Total})},
async expedirPendencia(id){const {error}=await sb.from('pendencias_emissao').update({status_expedicao:'expedido',motivo_expedicao:null}).eq('id',id);if(error) throw error},
async deletarPendencia(id){const {error}=await sb.from('pendencias_emissao').delete().eq('id',id);if(error) throw error},
async uploadNfImagem(file,pendenciaId){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${pendenciaId}/${Date.now()}.${ext}`;const {error}=await sb.storage.from('nf-anexos').upload(path,file,{upsert:true});if(error) throw error;return path},
async urlNfImagem(path){const {data,error}=await sb.storage.from('nf-anexos').createSignedUrl(path,3600);if(error) throw error;return data.signedUrl},
}

function EsqueciSenha({onClose}){const [email,setEmail]=useState('');const [enviando,setEnviando]=useState(false);const [enviado,setEnviado]=useState(false);const enviar=async()=>{if(!email.trim()) return;setEnviando(true);try{ await db.esqueciSenha(email.trim().toLowerCase()) }catch{};setEnviando(false);setEnviado(true)};return (<div style={S.modal} onClick={e=>e.target===e.currentTarget&&onClose()}><div className="cb-modal-box" style={{maxWidth:380}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><span style={{fontSize:13,fontWeight:700,color:'var(--accent)',letterSpacing:2}}>ESQUECI MINHA SENHA</span><button style={S.btnS} onClick={onClose}>✕</button></div>{enviado?(<div style={S.okBox}>Se o e-mail existir em nossa base, o administrador foi notificado e vai te passar uma nova senha.</div>):(<><p style={{fontSize:12,color:'var(--fg-2)',marginBottom:14,lineHeight:1.6}}>Informe seu e-mail. O administrador do sistema vai ser avisado e vai te passar uma nova senha temporária.</p><Field label="E-mail" value={email} onChange={setEmail} type="email" placeholder="seu@email.com" onEnter={enviar}/><button style={{...S.btnP,marginTop:14,opacity:enviando?0.6:1}} onClick={enviar} disabled={enviando}>{enviando?'Enviando...':'Solicitar troca de senha'}</button></>)}</div></div>)}
function Login({onLogin}){const [email,setEmail]=useState('');const [senha,setSenha]=useState('');const [erro,setErro]=useState('');const [loading,setLoading]=useState(false);const [showEsqueci,setShowEsqueci]=useState(false);const ok=async()=>{ setErro('');setLoading(true); try{await onLogin(email.trim().toLowerCase(),senha)}catch{setErro('E-mail ou senha incorretos.')} setLoading(false) };return (<div style={S.center}><div style={{width:'100%',maxWidth:400}}><div className="cb-logo-wrap"><img className="cb-logo-emerge" src="/brand/dragon-logo.png" alt="" onError={e=>{e.target.style.display='none'}}/></div><div className="cb-neon-wrap"><div className="cb-neon-inner" style={S.box}><div style={{width:'fit-content',margin:'0 auto 18px',background:'rgba(255,255,255,0.95)',borderRadius:8,padding:'8px 14px'}}><img src="/brand/logo-full.webp" alt="Atualcargas" style={{height:26,display:'block'}} onError={e=>{e.target.parentElement.style.display='none'}}/></div><div style={S.logoT}>Cubagens</div><div style={S.logoS}>BLUMENAU · SISTEMA DE CARGAS</div><Field label="E-mail" value={email} onChange={setEmail} type="email" placeholder="seu@email.com" onEnter={ok}/><Field label="Senha" value={senha} onChange={setSenha} type="password" placeholder="••••••" mt onEnter={ok}/>{erro && <div style={S.errBox}>{erro}</div>}<button style={{...S.btnP,marginTop:20,opacity:loading?0.6:1}} onClick={ok} disabled={loading}>{loading?'Entrando...':'Entrar'}</button><div style={{textAlign:'center',marginTop:14}}><span style={{fontSize:11,color:'var(--muted)',cursor:'pointer',textDecoration:'underline'}} onClick={()=>setShowEsqueci(true)}>Esqueci minha senha</span></div></div></div></div>{showEsqueci&&<EsqueciSenha onClose={()=>setShowEsqueci(false)}/>}</div>)}
function TrocaSenha({obrigatoria,onClose,onSave}){const [s1,setS1]=useState('');const [s2,setS2]=useState('');const [erro,setErro]=useState('');const [salvando,setSalvando]=useState(false);const valida=()=>{ if(s1.length<8) return 'A senha deve ter no mínimo 8 caracteres.'; if(s1!==s2) return 'As senhas não coincidem.'; return '' };const ok=async()=>{ const v=valida(); setErro(v); if(v) return; setSalvando(true); try{ await onSave(s1) }catch(e){ setErro(e.message) }; setSalvando(false) };const campos=(<><Field label="Nova senha" value={s1} onChange={setS1} type="password" placeholder="mín. 8 caracteres" onEnter={ok}/><Field label="Confirmar nova senha" value={s2} onChange={setS2} type="password" placeholder="repita a senha" mt onEnter={ok}/>{erro&&<div style={S.errBox}>{erro}</div>}<div style={{display:'flex',gap:8,marginTop:20}}>{!obrigatoria&&<button style={{...S.btnS,flex:1}} onClick={onClose}>Cancelar</button>}<button style={{...S.btnP,flex:2,opacity:salvando?0.6:1}} onClick={ok} disabled={salvando}>{salvando?'Salvando...':'Salvar senha'}</button></div></>);if(obrigatoria) return (<div style={S.center}><div style={S.box}><div style={S.logoT}>Nova senha</div><div style={S.logoS}>DEFINA UMA SENHA DEFINITIVA PARA CONTINUAR</div>{campos}</div></div>);return (<div style={S.modal} onClick={e=>e.target===e.currentTarget&&onClose&&onClose()}><div className="cb-modal-box" style={{maxWidth:400}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><span style={{fontSize:13,fontWeight:700,color:'var(--accent)',letterSpacing:2}}>ALTERAR SENHA</span><button style={S.btnS} onClick={onClose}>✕</button></div>{campos}</div></div>)}

function Placa({ placa }) {
  const p = String(placa || "").toUpperCase();
  if (!p || p === "ARMAZEM" || p === "ARMAZÉM")
    return (
      <div className="cb-dock">
        <b>ARMAZÉM</b>
        <small>sem placa</small>
      </div>
    );
  return (
    <div className="cb-plate" aria-label={"Placa " + p}>
      <div className="cb-plate-band">
        <span className="ms">MERCOSUL</span>
        <span className="br">BRASIL</span>
        <span className="cb-flag" aria-hidden="true" />
      </div>
      <div className="cb-plate-chars">{p}</div>
    </div>
  );
}
function MiniPlaca({ placa }) {
  const p = String(placa || "").toUpperCase();
  if (!p) return <span style={{ color: "var(--muted)" }}>—</span>;
  if (p === "ARMAZEM" || p === "ARMAZÉM") return <span className="cb-mini-dock">ARMAZÉM</span>;
  return (
    <span className="cb-mini-plate" aria-label={"Placa " + p}>
      <i />
      <span>{p}</span>
    </span>
  );
}
function FrotasGrid({ frotas, onFrota, contagem, compacto }) {
  if (!frotas || frotas.length === 0) return <p style={{ color: "var(--muted)", fontSize: 13 }}>Nenhuma frota cadastrada.</p>;
  return (
    <div className={"cb-frotas" + (compacto ? " compact" : "")}>
      {frotas.map((f) => (
        <button key={f.id} type="button" className="cb-frota" onClick={() => onFrota(f)}>
          <Placa placa={f.placa} />
          <div className="cb-frota-foot">
            <span className="go">→ lançar cubagem</span>
            {contagem && <span className="pend cb-num">{contagem(f)}</span>}
          </div>
        </button>
      ))}
    </div>
  );
}
function Dashboard({ frotas, onFrota }) {
  const [stats, setStats] = useState(null);
  const [porFrota, setPorFrota] = useState({});
  useEffect(() => {
    let ativo = true;
    db.listarRegistrosPorPeriodo(todayStr(), todayStr())
      .then((regs) => {
        if (!ativo) return;
        const m3Hoje = regs.reduce((s, r) => s + (parseFloat(r.m3_total) || 0), 0);
        const volHoje = regs.reduce((s, r) => s + (parseInt(r.qtd_total) || 0), 0);
        const pf = {};
        regs.forEach((r) => {
          pf[r.frota_id] = (pf[r.frota_id] || 0) + 1;
        });
        setPorFrota(pf);
        setStats({ cubagens: regs.length, m3: m3Hoje, volumes: volHoje });
      })
      .catch(() => setStats({ cubagens: 0, m3: 0, volumes: 0 }));
    return () => {
      ativo = false;
    };
  }, []);
  return (
    <div className="cb-page">
      <div className="cb-head">
        <div>
          <div className="cb-eyebrow">
            {new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" })}
          </div>
          <h1 className="cb-h1">Lançar cubagem</h1>
          <p className="cb-sub">Escolha a frota que está sendo carregada.</p>
        </div>
      </div>
      <div className="cb-kpis" style={{ marginBottom: 6 }}>
        <MetricCard label="cubagens hoje" valor={stats?.cubagens} loading={!stats} />
        <MetricCard
          label="m³ lançados hoje"
          valor={stats ? stats.m3.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : null}
          cor="var(--accent)"
          loading={!stats}
        />
        <MetricCard label="volumes hoje" valor={stats?.volumes} loading={!stats} />
        <MetricCard label="frotas ativas" valor={(frotas || []).length} />
      </div>
      <div className="cb-label-row">
        <span>Selecionar frota</span>
        <span>{(frotas || []).length} frotas</span>
      </div>
      <FrotasGrid
        frotas={frotas}
        onFrota={onFrota}
        contagem={stats ? (f) => (porFrota[f.id] ? porFrota[f.id] + " hoje" : "nenhuma hoje") : null}
      />
    </div>
  );
}
function MetricCard({ label, valor, cor, loading }) {
  return (
    <div className="cb-kpi">
      {loading ? <SkeletonBar width={56} height={26} /> : <b style={{ color: cor || "var(--fg)" }}>{valor}</b>}
      <small>{label}</small>
    </div>
  );
}

function GrupoMedida({grupo,index,total,onChange,onRemove}){const isM=grupo.unidade!=='mm';const step=isM?0.01:1;const toM=v=>isM?parseNum(v):parseNum(v)/1000;const m3g=toM(grupo.largura)*toM(grupo.altura)*toM(grupo.comprimento)*(parseInt(grupo.qtd)||0);return (<div style={{background:'var(--inset)',border:'1px solid var(--line)',borderRadius:10,padding:14,marginBottom:10}}><div style={{display:'flex',alignItems:'center',marginBottom:12,gap:8,flexWrap:'wrap'}}><span style={{fontSize:11,color:'var(--muted)',letterSpacing:2,fontWeight:700}}>GRUPO {index+1}</span><div style={{display:'flex',gap:3,marginLeft:8}}>{['m','mm'].map(u=>(<button key={u} style={{...S.btnS,padding:'2px 8px',fontSize:11,borderColor:grupo.unidade===u?'var(--accent)':'var(--line)',color:grupo.unidade===u?'var(--accent)':'var(--muted)'}} onClick={()=>onChange(grupo.id,'unidade',u)}>{u}</button>))}</div>{total>1&&<button style={{...S.btnD,padding:'2px 8px',fontSize:11,marginLeft:'auto'}} onClick={()=>onRemove(grupo.id)}>✕</button>}</div><div style={{marginBottom:12}}><label style={S.label}>Qtd. volumes neste grupo</label><input style={S.input} type="number" min="1" value={grupo.qtd} onChange={e=>onChange(grupo.id,'qtd',e.target.value)} placeholder="Ex: 15"/></div>{[{k:'altura',l:'Altura'},{k:'largura',l:'Largura'},{k:'comprimento',l:'Comprimento'}].map(({k,l})=>(<div key={k} style={{marginBottom:12}}><label style={S.label}>{l} ({grupo.unidade})</label><input style={S.input} type="number" min={step} step={step} value={grupo[k]} onChange={e=>onChange(grupo.id,k,e.target.value)} placeholder={isM?'0.00':'0'}/></div>))}{grupo.qtd&&grupo.largura&&grupo.altura&&grupo.comprimento&&(<div style={{padding:'7px 10px',background:'var(--surface)',borderRadius:6,display:'flex',justifyContent:'space-between',fontSize:13}}><span style={{color:'var(--muted)'}}>M³ deste grupo</span><b style={{color:'var(--accent)'}}>{m3g.toFixed(4)} m³</b></div>)}</div>)}

function CaixaPreview({ grupo }) {
  const t = (v) => (grupo.unidade === "mm" ? parseNum(v) / 1000 : parseNum(v));
  let L = t(grupo.largura),
    C = t(grupo.comprimento),
    A = t(grupo.altura);
  const vazio = !(L > 0 && C > 0 && A > 0);
  if (vazio) {
    L = 1;
    C = 1;
    A = 1;
  }
  const mx = Math.max(L, C, A);
  L /= mx;
  C /= mx;
  A /= mx;
  const k = 38,
    cx = Math.cos(Math.PI / 6);
  const P = (x, y, z) => [60 + (x - z) * cx * k, 78 - y * k + (x + z) * 0.5 * k];
  const o = [P(0, 0, 0), P(L, 0, 0), P(L, 0, C), P(0, 0, C), P(0, A, 0), P(L, A, 0), P(L, A, C), P(0, A, C)];
  const ys = o.map((p) => p[1]);
  const dy = 50 - (Math.min(...ys) + Math.max(...ys)) / 2;
  const pts = (ids) => ids.map((i) => o[i][0].toFixed(1) + "," + (o[i][1] + dy).toFixed(1)).join(" ");
  return (
    <svg viewBox="0 0 120 100" role="img" aria-label="Formato do volume" style={{ opacity: vazio ? 0.25 : 1, transition: "opacity .2s" }}>
      <polygon points={pts([0, 1, 5, 4])} fill="var(--accent)" stroke="var(--ink)" strokeWidth="1" />
      <polygon points={pts([0, 3, 7, 4])} fill="var(--royal)" stroke="var(--ink)" strokeWidth="1" />
      <polygon points={pts([4, 5, 6, 7])} fill="var(--accent-hi)" stroke="var(--ink)" strokeWidth="1" />
    </svg>
  );
}

  return parseInt(g.qtd) > 0 && parseNum(g.altura) > 0 && parseNum(g.largura) > 0 && parseNum(g.comprimento) > 0;

function Historico({frotas,perfil,showToast}){const [editReg,setEditReg]=useState(null);const [confirmDel,setConfirmDel]=useState(null);const [filtroFrota,setFiltroFrota]=useState('');const [filtroNota,setFiltroNota]=useState('');const [dataIni,setDataIni]=useState(todayStr());const [dataFim,setDataFim]=useState(todayStr());const [registros,setRegistros]=useState([]);const [carregando,setCarregando]=useState(true);const recarregar=useCallback(async()=>{ setCarregando(true); try{ setRegistros(await db.listarRegistrosPorPeriodo(dataIni,dataFim,filtroFrota||null)) }catch(e){ showToast('Erro ao carregar histórico: '+e.message,'err') }; setCarregando(false) },[dataIni,dataFim,filtroFrota]);useEffect(()=>{ recarregar() },[recarregar]);const lista=[...(registros||[])].filter(r=>!filtroNota||r.nota.toLowerCase().includes(filtroNota.toLowerCase())).sort((a,b)=>new Date(b.criado_em)-new Date(a.criado_em));const handleDelete=async id=>{ try{await db.deletarRegistro(id);setConfirmDel(null);showToast('Cubagem excluída.','err');await recarregar()}catch(e){showToast('Erro: '+e.message,'err')} };const handleEdit=async(id,grupos,motivo)=>{ const m3=calcM3(grupos); try{await db.editarRegistro(id,grupos.map(g=>({...g,...dimsM(g)})),motivo,m3,perfil);setEditReg(null);showToast('Cubagem atualizada!');await recarregar()}catch(e){showToast('Erro: '+e.message,'err')} };const downloadCSV=()=>{ const BOM='\uFEFF'; const header=['ID','Frota','Data','Usuário','Cliente','Nota','Vol.Total','Grupo','Vol.Grupo','Alt(m)','Larg(m)','Comp(m)','M³Grupo','M³Total','Status'].join(';'); const rows=[]; lista.forEach(r=>{ (r.grupos||[]).forEach((g,gi)=>{ const a=g.altura_m??0,l=g.largura_m??0,c=g.comprimento_m??0; rows.push([r.id,r.frota_placa,fmtDate(r.criado_em),r.user_email,r.cliente,r.nota,r.qtd_total,`G${gi+1}`,g.qtd,a.toFixed(3),l.toFixed(3),c.toFixed(3),(a*l*c*g.qtd).toFixed(4),parseFloat(r.m3_total).toFixed(4),r.editado?'EDITADO':'ORIGINAL'].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')) }) }); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([BOM+header+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8;'})); a.download=`cubagens_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a);a.click();document.body.removeChild(a); showToast('CSV baixado!') };return (<div className="cb-page"><div className="cb-sync-bar"><h1 style={{fontSize:16,fontWeight:700,color:'var(--accent)',letterSpacing:2,flex:1,minWidth:100,fontFamily:"'Space Grotesk','Inter',sans-serif"}}>HISTÓRICO</h1><button style={S.btnS} onClick={downloadCSV}>↓ CSV</button></div><div className="cb-card"><div className="cb-field-row" style={{marginBottom:12}}><div style={{minWidth:130}}><label style={S.label}>De</label><input style={S.input} type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)}/></div><div style={{minWidth:130}}><label style={S.label}>Até</label><input style={S.input} type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)}/></div><div style={{minWidth:120}}><label style={S.label}>Frota</label><select style={{...S.select,width:'100%'}} value={filtroFrota} onChange={e=>setFiltroFrota(e.target.value)}><option value="">Todas</option>{(frotas||[]).map(f=><option key={f.id} value={f.id}>{f.placa}</option>)}</select></div><div style={{flex:1,minWidth:140,position:'relative'}}><label style={S.label}>Buscar nota</label><input style={S.input} value={filtroNota} onChange={e=>setFiltroNota(e.target.value)} placeholder="Ex: 2026"/></div><button style={{...S.btnS,marginTop:18}} onClick={()=>{setDataIni(todayStr());setDataFim(todayStr())}}>Hoje</button></div>{carregando?<SkeletonTableRows rows={5} cols={7}/>:<DateGroupedTable registros={lista} onEdit={setEditReg} onDelete={isAdmin(perfil)?setConfirmDel:null}/>}</div>{editReg&&<ModalEdicao reg={editReg} perfil={perfil} onClose={()=>setEditReg(null)} onSave={handleEdit}/>}{confirmDel&&<ModalConfirmDel reg={confirmDel} onConfirm={()=>handleDelete(confirmDel.id)} onCancel={ const STATUS_EXP_LABELS={pendente:'Pendente',expedido:'Expedido',cte_anulado:'CTe anulado'}
const podeExcluirPendencia=p=>isAdmin(p)||p?.role==='expedicao'
function PainelExpedicao({ p, onClose, onSaved }) {
  const [status, setStatus] = useState(p.status_expedicao);
  const [houveFalta, setHouveFalta] = useState(p.houve_falta || false);
  const [qtdFalta, setQtdFalta] = useState(p.qtd_falta != null ? String(p.qtd_falta) : "");
  const [obs, setObs] = useState(p.observacao_expedicao || "");
  const [cteNumero, setCteNumero] = useState(p.cte_anulado_numero || "");
  const [motivo, setMotivo] = useState(p.motivo_expedicao || "");
  const [salvando, setSalvando] = useState(false);
  const salvar = async () => {
    if (status === "cte_anulado" && !cteNumero.trim()) {
      alert("Informe o número do CTe anulado.");
      return;
    }
    setSalvando(true);
    try {
      await db.atualizarPendencia(p.id, {
        status_expedicao: status,
        houve_falta: houveFalta,
        qtd_falta: houveFalta ? parseInt(qtdFalta) || 0 : null,
        observacao_expedicao: obs || null,
        cte_anulado_numero: status === "cte_anulado" ? cteNumero.trim() : null,
        motivo_expedicao: status === "expedido" ? null : motivo || null,
      });
      onSaved();
    } catch (e) {
      alert("Erro: " + e.message);
    }
    setSalvando(false);
  };
  return (
    <div style={S.modal} onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="cb-modal-box" style={{ maxWidth: 380 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: "var(--accent)", letterSpacing: 2 }}>EXPEDIÇÃO · {p.cliente}</span>
          <button style={S.btnS} onClick={onClose}>
            ✕
          </button>
        </div>
        <label style={S.label}>Status</label>
        <select style={{ ...S.select, width: "100%", marginBottom: 10 }} value={status} onChange={(e) => setStatus(e.target.value)}>
          {Object.keys(STATUS_EXP_LABELS).map((k) => (
            <option key={k} value={k}>
              {STATUS_EXP_LABELS[k]}
            </option>
          ))}
        </select>
        {status === "cte_anulado" && (
          <div style={{ marginBottom: 10 }}>
            <label style={S.label}>Número do CTe anulado *</label>
            <input style={S.input} value={cteNumero} onChange={(e) => setCteNumero(e.target.value)} placeholder="Ex: BLNTUB811867-1" />
          </div>
        )}
        {status === "pendente" && (
          <>
            <label style={S.label}>Motivo da pendência</label>
            <select style={{ ...S.select, width: "100%", marginBottom: 10 }} value={motivo} onChange={(e) => setMotivo(e.target.value)}>
              <option value="">— nenhum —</option>
              {MOTIVOS_EXP_EDITAVEIS.map((k) => (
                <option key={k} value={k}>
                  {MOTIVOS_EXP[k]}
                </option>
              ))}
            </select>
          </>
        )}
        <label style={{ ...S.label, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
          <input type="checkbox" checked={houveFalta} onChange={(e) => setHouveFalta(e.target.checked)} /> Houve falta?
        </label>
        {houveFalta && (
          <input
            style={{ ...S.input, marginTop: 6, marginBottom: 10 }}
            type="number"
            min="0"
            value={qtdFalta}
            onChange={(e) => setQtdFalta(e.target.value)}
            placeholder="Qtd. em falta"
          />
        )}
        <label style={S.label}>Observação</label>
        <textarea
          style={{ ...S.input, minHeight: 70, resize: "vertical", marginBottom: 14 }}
          value={obs}
          onChange={(e) => setObs(e.target.value)}
          placeholder="Observação de expedição..."
        />
        <div style={{ display: "flex", gap: 8 }}>
          <button style={{ ...S.btnS, flex: 1 }} onClick={onClose}>
            Cancelar
          </button>
          <button style={{ ...S.btnY, flex: 2, opacity: salvando ? 0.6 : 1 }} disabled={salvando} onClick={salvar}>
            {salvando ? "Salvando..." : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

function etapaDe(p) {
  if (p.status_expedicao === "expedido") return 5;
  if (p.status_comercial === "liberado") return 4;

function problemasDe(p) {
  const r = [];
  if (p.status_expedicao === "cte_anulado") r.push({ k: "crit", t: "CT-e anulado" + (p.cte_anulado_numero ? " " + p.cte_anulado_numero : "") });

  if (p.motivo_expedicao === "divergencia_cubagem") r.push({ k: "warn", t: "Divergência de cubagem" });
  if (p.motivo_comercial === "divergencia_frete") r.push({ k: "warn", t: "Divergência de frete" });

function diasParado(p) {

function validarAnexo(file, soImagem) {
  if (!file) return "Nenhum arquivo selecionado.";
  const tipos = soImagem ? ANEXO_TIPOS.filter((t) => t.startsWith("image/")) : ANEXO_TIPOS;
  if (!tipos.includes(file.type)) return soImagem ? "Envie uma imagem PNG, JPG ou WEBP." : "Envie PDF ou imagem (PNG, JPG ou WEBP).";

        .then((u) => ativo && setUrl(u))

      ativo = false;
    };
  }, [path]);

}

function usePendencias(versao, showToast) {
  const [lista, setLista] = useState(null);
  useEffect(() => {
    let ativo = true;
    db.listarPendencias()
      .then((l) => ativo && setLista(l))
      .catch((e) => {
        showToast("Erro ao carregar pendências: " + e.message, "err");
        ativo && setLista([]);

    return () => {
      ativo = false;
    };

  return lista;
}

        grupos.map((et) => {
          const itens = filtradas.filter((p) => etapaDe(p) === et.n).sort((a, b) => diasParado(b) - diasParado(a));

function RelatorioExpedidas({ lista, onAbrir }) {
  const [mes, setMes] = useState(() => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  });
  const mover = (delta) => {
    const [a, m] = mes.split("-").map(Number);
    const d = new Date(a, m - 1 + delta, 1);
    setMes(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
  };
  const nomeMes = new Date(mes + "-15T12:00:00").toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  const doMes = lista
    .filter((p) => p.status_expedicao === "expedido" && p.expedido_em && fmtMesLocal(p.expedido_em) === mes)
    .sort((a, b) => new Date(b.expedido_em) - new Date(a.expedido_em));
  const m3 = doMes.reduce((s, p) => s + (parseFloat(p.m3_total) || 0), 0);
  const frete = doMes.reduce((s, p) => s + (parseFloat(p.frete_valor) || 0), 0);
  return (
    <>
      <div className="cb-label-row" style={{ marginTop: 34, alignItems: "center" }}>
        <span>Expedidas no mês</span>
        <span className="cb-month">
          <button type="button" style={{ ...S.btnS, padding: "2px 10px" }} onClick={() => mover(-1)} aria-label="Mês anterior">
            ‹
          </button>
          <b>{nomeMes}</b>
          <button type="button" style={{ ...S.btnS, padding: "2px 10px" }} onClick={() => mover(1)} aria-label="Próximo mês">
            ›
          </button>
        </span>
      </div>
      <div className="cb-sumline" style={{ marginBottom: 12 }}>
        <span>
          <b>{doMes.length}</b> notas
        </span>
        <span>
          <b>{m3.toLocaleString("pt-BR", { minimumFractionDigits: 4, maximumFractionDigits: 4 })}</b> m³
        </span>
        <span>
          <b>{fmtMoedaBR(frete)}</b> em frete
        </span>
        <span>Clique numa linha para ver medidas, chave e observações.</span>
      </div>
      {doMes.length === 0 ? (
        <div className="cb-rows">
          <div className="cb-empty-row">Nenhuma nota expedida neste mês.</div>
        </div>
      ) : (
        <div className="cb-tbl-wrap">
          <table className="cb-tbl cb-tbl-click">
            <thead>
              <tr>
                <th>Expedida em</th>
                <th>Nota fiscal</th>
                <th>Frota</th>
                <th>Carga</th>
                <th>Cotação</th>
                <th>Frete</th>
                <th>Observação</th>
              </tr>
            </thead>
            <tbody>
              {doMes.map((p) => (
                <tr key={p.id} tabIndex={0} onClick={() => onAbrir(p)} onKeyDown={(e) => e.key === "Enter" && onAbrir(p)}>
                  <td className="cb-num" style={{ whiteSpace: "nowrap" }}>
                    {fmtDate(p.expedido_em).slice(0, 17)}
                  </td>
                  <td className="cb-nfcell">
                    <b className="cb-num">NF {p.nf_numero || "—"}</b>
                    <small>{p.cliente}</small>
                  </td>
                  <td>
                    <MiniPlaca placa={p.frota_placa} />
                  </td>
                  <td className="cb-num" style={{ whiteSpace: "nowrap" }}>
                    {fmtCarga(p)}
                  </td>
                  <td className="cb-num">{p.cotacao_numero || "—"}</td>
                  <td className="cb-num" style={{ whiteSpace: "nowrap" }}>
                    {fmtMoedaBR(p.frete_valor)}
                  </td>
                  <td>
                    <div className="cb-ellip">{p.observacao_comercial || p.observacao_expedicao || "—"}</div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

        setErroFatal(e.message || "Erro ao carregar sessão.");
      }
      setLoading(false);
    });
    const {
      data: { subscription },
    } = sb.auth.onAuthStateChange(async (event, session) => {
      try {
        if (session) {
          setSession(session);
          const p = await db.getPerfil(session.user.id);
          setPerfil(p);
          aplicarViewInicial(p);
          await carregarDados();
          await atualizarBadgeSolicitacoes(p);
        } else {
          viewInicialDe.current = null;
          setDrawerPend(null);
          setPainelExpPend(null);
          setFormPend(null);
          setSession(null);
          setPerfil(null);
          setFrotas([]);
          setClientes([]);
          setView("dashboard");
          setFrota(null);
          setSolicitacoesPendentes(0);
        }
      } catch (e) {
        setErroFatal(e.message || "Erro ao carregar sessão.");
      }
    });
    return () => subscription.unsubscribe();
  }, [carregarDados, atualizarBadgeSolicitacoes]);
  if (erroFatal)
    return (
      <div style={S.center}>
        <div style={S.box}>
          <div style={{ ...S.logoT, color: "var(--crit)" }}>Erro ao carregar</div>
          <div style={S.errBox}>{erroFatal}</div>
          <button
            style={{ ...S.btnP, marginTop: 16 }}
            onClick={() => {
              sb.auth.signOut();
              window.location.reload();
            }}
          >
            Sair e tentar de novo
          </button>
        </div>
      </div>
    );
  if (loading)
    return (
      <div
        style={{
          minHeight: "100vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          background: "linear-gradient(135deg,var(--inset),var(--surface))",
        }}
      >
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 22, fontWeight: 700, color: "var(--accent)", letterSpacing: 2 }}>CUBAGENS</div>
          <div style={{ fontSize: 12, color: "var(--muted)", letterSpacing: 2, marginTop: 10 }}>CARREGANDO...</div>
        </div>
      </div>
    );
  if (!session) return <Login onLogin={(e, s) => db.signIn(e, s)} />;
  if (perfil?.deve_trocar_senha)
    return (
      <TrocaSenha
        obrigatoria
        onSave={async (novaSenha) => {
          await db.trocarSenha(novaSenha, session.user.id);
          setPerfil((p) => ({ ...p, deve_trocar_senha: false }));
          showToast("Senha atualizada!");
        }}
      />
    );
  return (
    <div style={{ minHeight: "100vh", background: "var(--inset)", color: "var(--fg)", fontFamily: "'Inter',sans-serif" }}>
      <nav className="cb-nav">
        <span className="cb-nav-title cb-brand" style={{ fontSize: 13, fontWeight: 700, color: "var(--accent)", letterSpacing: 2, flex: 1 }}>
          ATUALCARGAS <span style={{ color: "var(--muted)", fontWeight: 500, fontSize: 11 }}>CUBAGENS BLN</span>
        </span>
        <span className="cb-nav-badge" style={{ fontSize: 11, color: "var(--muted)" }}>
          {perfil?.nome}
        </span>
        <span className="cb-nav-badge">
          <RoleBadge role={perfil?.role} />
        </span>
        {menuDe(perfil).map(([v, rotulo]) => (
          <button
            key={v}
            className="cb-nav-btn"
            aria-current={view === v || (v === "dashboard" && view === "frota") ? "page" : undefined}
            style={{ ...S.btnS, position: "relative" }}
            onClick={() => irPara(v)}
          >
            {rotulo}
            {v === "admin" && solicitacoesPendentes > 0 && (
              <span
                style={{
                  position: "absolute",
                  top: -6,
                  right: -6,
                  background: "var(--crit)",
                  color: "#fff",
                  borderRadius: 10,
                  fontSize: 10,
                  fontWeight: 700,
                  padding: "1px 5px",
                  lineHeight: 1.4,
                }}
              >
                {solicitacoesPendentes}
              </span>
            )}
          </button>
        ))}
        <button style={S.btnS} onClick={() => setTrocaSenhaVoluntaria(true)}>
          Senha
        </button>
        <button style={S.btnD} onClick={() => db.signOut()}>
          Sair
        </button>
      </nav>
      {trocaSenhaVoluntaria && (
        <TrocaSenha
          onClose={() => setTrocaSenhaVoluntaria(false)}
          onSave={async (novaSenha) => {
            await db.trocarSenha(novaSenha, session.user.id);
            setTrocaSenhaVoluntaria(false);
            showToast("Senha atualizada!");
          }}
        />
      )}
      {toast && (
        <div
          style={{
            position: "fixed",
            top: 58,
            right: 10,
            left: 10,
            zIndex: 300,
            padding: "10px 14px",
            borderRadius: 8,
            fontSize: 13,
            fontFamily: "inherit",
            background: toast.type === "ok" ? "var(--ok-soft)" : "var(--crit-soft)",
            border: `1px solid ${toast.type === "ok" ? "var(--ok)" : "var(--crit)"}`,
            color: toast.type === "ok" ? "var(--ok)" : "var(--crit)",
            maxWidth: 380,
            marginLeft: "auto",
          }}
        >
          {toast.msg}
        </div>
      )}
      <div key={view} className="cb-view-enter">
        {view === "dashboard" && podeLancar(perfil) && (
          <Dashboard
            frotas={frotas}
            onFrota={(f) => {
              setFrota(f);
              setView("frota");
            }}
          />
        )}
        {view === "frota" && frota && podeLancar(perfil) && (
          <FrotaView
            frota={frota}
            clientes={clientes}
            session={session}
            perfil={perfil}
            onBack={() => irPara("dashboard")}
            showToast={showToast}
          />
        )}
        {view === "mapa" && podeVerPendencias(perfil) && (
          <MapaPendencias
            perfil={perfil}
            showToast={showToast}
            versao={versao}
            onAbrir={abrirNota}
          />
        )}
        {(view === "expedicao" && isExpedicao(perfil)) || (view === "comercial" && isComercial(perfil)) ? (
          <PendenciaEmissao
            modo={view}
            perfil={perfil}
            frotas={frotas}
            showToast={showToast}
            versao={versao}
            onAbrir={abrirNota}
            onChanged={recarregarListas}
            onNova={() => setFormPend({ pendencia: null })}
            onFrota={(f) => {
              setFrota(f);
              setView("frota");
            }}
          />
        ) : null}
        {view === "admin" && isAdmin(perfil) && (
          <AdminView
            perfil={perfil}
            session={session}
            frotas={frotas}
            setFrotas={setFrotas}
            clientes={clientes}
            setClientes={setClientes}
            showToast={showToast}
            onSolicitacoesAtualizadas={() => atualizarBadgeSolicitacoes(perfil)}
          />
        )}
        {view === "historico" && podeHistorico(perfil) && <Historico frotas={frotas} perfil={perfil} showToast={showToast} />}
        {!menuDe(perfil).some(([v]) => v === view || (v === "dashboard" && view === "frota")) && (
          <div className="cb-page">
            <div className="cb-card" style={{ textAlign: "center", padding: 40 }}>
              <div className="cb-h1" style={{ fontSize: 18, marginBottom: 6 }}>Sem acesso a esta página</div>
              <p style={{ color: "var(--muted)", fontSize: 13, marginBottom: 14 }}>Seu perfil não tem permissão para esta área.</p>
              <button style={S.btnY} onClick={() => irPara(viewInicial(perfil))}>
                Ir para o início
              </button>
            </div>
          </div>
        )}
      </div>
      {drawerPend && (
        <DetalheNota
          key={drawerPend.id}
          p={drawerPend}
          perfil={perfil}
          showToast={showToast}
          onClose={() => setDrawerPend(null)}
          onChanged={atualizarDrawer}
          onEditar={(p) => setFormPend({ pendencia: p })}
          onStatus={setPainelExpPend}
        />
      )}
      {formPend && (
        <FormPendencia
          pendencia={formPend.pendencia}
          frotas={frotas}
          clientes={clientes}
          perfil={perfil}
          showToast={showToast}
          onClose={() => setFormPend(null)}
          onSaved={async (msg) => {
            const editada = formPend.pendencia;
            setFormPend(null);
            showToast(msg);
            if (editada && drawerPend && drawerPend.id === editada.id) await atualizarDrawer();
            else recarregarListas();
          }}
        />
      )}
      {painelExpPend && (
        <PainelExpedicao
          p={painelExpPend}
          onClose={() => setPainelExpPend(null)}
          onSaved={async () => {
            setPainelExpPend(null);
            showToast("Expedição atualizada!");
            await atualizarDrawer();
          }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
