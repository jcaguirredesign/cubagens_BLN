*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0f1117;font-family:'Inter',sans-serif;font-size:14px;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(34,211,238,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,0.035) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%)}
#root{min-height:100vh;position:relative;z-index:1}
.cb-brand{font-family:'Space Grotesk','Inter',sans-serif}
@keyframes cb-fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cb-view-enter{animation:cb-fade-up .28s ease-out both}
@keyframes cb-shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.cb-skel{background:linear-gradient(90deg,#1a1f2e 25%,#232a40 37%,#1a1f2e 63%);background-size:400px 100%;animation:cb-shimmer 1.4s ease-in-out infinite;border-radius:6px}
button{transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background-color .12s ease}
button:active{transform:scale(0.97)}
button:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important}
}
.cb-page{padding:20px 16px;max-width:1200px;margin:0 auto;width:100%}
.cb-card{background:#1a1f2e;border:1px solid #2a3050;border-radius:12px;padding:18px 20px;margin-bottom:14px}
.cb-nav{background:#1a1f2e;border-bottom:1px solid #2a3050;padding:0 16px;display:flex;align-items:center;min-height:52px;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.cb-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cb-modal-box{background:#1a1f2e;border:1px solid #2a3050;border-radius:14px;padding:24px 20px;width:min(96vw,600px);max-height:92vh;overflow-y:auto}
.cb-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}
.cb-frota-btn{background:#1a1f2e;border:2px solid #2a3050;border-radius:12px;padding:20px 14px;cursor:pointer;text-align:center;transition:border-color .15s;user-select:none}
.cb-frota-btn:hover,.cb-frota-btn:active{border-color:#22d3ee}
.cb-field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cb-sync-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
@media (max-width:768px){.cb-page{padding:12px 10px}.cb-card{padding:12px 12px}.cb-nav{padding:6px 10px;min-height:48px}.cb-grid{grid-template-columns:repeat(2,1fr);gap:8px}.cb-modal-box{padding:16px 12px}.cb-hide-mobile{display:none!important}.cb-field-row{flex-direction:column}.cb-field-row>*{width:100%!important;min-width:unset!important}table{font-size:11px}th,td{padding:5px 6px!important}}
@media (max-width:400px){.cb-grid{grid-template-columns:1fr 1fr}.cb-nav-title{font-size:11px!important}.cb-nav-badge{display:none}}
@media (min-width:1024px){.cb-page{padding:28px 24px}.cb-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.cb-neon-wrap{position:relative;border-radius:16px;padding:2px;overflow:hidden}
.cb-neon-wrap::before{content:'';position:absolute;inset:-40%;z-index:0;background:conic-gradient(from 0deg,transparent 0deg,transparent 260deg,#22d3ee 300deg,#bff7ff 330deg,#22d3ee 345deg,transparent 360deg);animation:cb-neon-spin 3.5s linear infinite;filter:blur(1px)}
.cb-neon-inner{position:relative;z-index:1}
@keyframes cb-neon-spin{to{transform:rotate(360deg)}}
.cb-logo-wrap{position:relative;width:clamp(90px,28vw,150px);height:clamp(90px,28vw,150px);margin:0 auto 18px}
.cb-logo-wrap::before{content:'';position:absolute;inset:-15%;z-index:0;background:radial-gradient(closest-side,rgba(34,211,238,.55),transparent 72%);filter:blur(10px)}
.cb-logo-emerge{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;opacity:0;animation:cb-logo-emerge 1.1s ease-out forwards;transform:scale(.85)}
@keyframes cb-logo-emerge{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fmtDate(d){return new Date(d).toLocaleString('pt-BR')}
function fmtDim(v){return `${(parseFloat(v)||0).toFixed(2)}m`}
function novoGrupo(){return {id:uid(),qtd:'',altura:'',largura:'',comprimento:'',unidade:'m'}}
function dimsM(g){const t=v=>g.unidade==='mm'?(parseFloat(v)||0)/1000:parseFloat(v)||0;return {alturaM:t(g.altura),larguraM:t(g.largura),comprimentoM:t(g.comprimento)}}
function calcM3(grupos){return grupos.reduce((s,g)=>{const t=v=>g.unidade==='mm'?(parseFloat(v)||0)/1000:parseFloat(v)||0;return s+t(g.largura)*t(g.altura)*t(g.comprimento)*(parseInt(g.qtd)||0)},0)}
function isToday(d){const a=new Date(d),b=new Date();return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rangeISO(dataIni,dataFim){return {iniISO:new Date(dataIni+'T00:00:00').toISOString(),fimISO:new Date(dataFim+'T23:59:59.999').toISOString()}}
const db={
async signIn(email,password){const {error}=await sb.auth.signInWithPassword({email,password});if(error) throw error},
async signOut(){await sb.auth.signOut()},
async getPerfil(uid){const {data,error}=await sb.from('perfis').select('*').eq('id',uid).single();if(error) throw error;return data},
async listarFrotas(){const {data,error}=await sb.from('frotas').select('*').order('placa');if(error) throw error;return data||[]},

async removerFrota(id){const {error}=await sb.from('frotas').delete().eq('id',id);if(error) throw error},
async listarClientes(){const {data,error}=await sb.from('clientes').select('*').order('nome');if(error) throw error;return data||[]},
async adicionarCliente(nome){const {data,error}=await sb.from('clientes').insert({nome}).select().single();if(error) throw error;return data},
async removerCliente(id){const {error}=await sb.from('clientes').delete().eq('id',id);if(error) throw error},
async listarRegistrosPorPeriodo(dataIni,dataFim,frotaId){const {iniISO,fimISO}=rangeISO(dataIni,dataFim);let q=sb.from('registros').select('*, grupos(*)').gte('criado_em',iniISO).lte('criado_em',fimISO).order('criado_em',{ascending:false});if(frotaId) q=q.eq('frota_id',frotaId);const {data,error}=await q;if(error) throw error;return (data||[]).map(r=>({...r,grupos:(r.grupos||[]).sort((a,b)=>a.seq-b.seq)}))},
async trocarSenha(novaSenha,userId){const {error:e1}=await sb.auth.updateUser({password:novaSenha});if(e1) throw e1;const {error:e2}=await sb.from('perfis').update({deve_trocar_senha:false}).eq('id',userId);if(e2) throw e2},
async criarUsuario(payload,accessToken){const res=await fetch('/api/admin/criar-usuario',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+accessToken},body:JSON.stringify(payload)});const data=await res.json().catch(()=>({}));if(!res.ok) throw new Error(data.error||'Erro ao criar usuário.');return data},
async esqueciSenha(email){const res=await fetch('/api/auth/esqueci-senha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const data=await res.json().catch(()=>({}));if(!res.ok) throw new Error(data.error||'Erro ao enviar solicitação.');return data},
async redefinirSenha(userId,novaSenha,accessToken){const res=await fetch('/api/admin/redefinir-senha',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+accessToken},body:JSON.stringify({userId,novaSenha})});const data=await res.json().catch(()=>({}));if(!res.ok) throw new Error(data.error||'Erro ao redefinir senha.');return data},
async excluirUsuario(userId,accessToken){const res=await fetch('/api/admin/deletar-usuario',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+accessToken},body:JSON.stringify({userId})});const data=await res.json().catch(()=>({}));if(!res.ok) throw new Error(data.error||'Erro ao excluir usuário.');return data},
async salvarRegistro(reg,grupos,session,perfil){const {data:r,error:e1}=await sb.from('registros').insert({frota_id:reg.frotaId,frota_placa:reg.frotaPlaca,cliente:reg.cliente,nota:reg.nota,qtd_total:reg.qtdTotal,m3_total:reg.m3Total,user_id:session.user.id,user_email:session.user.email,user_nome:perfil.nome}).select().single();if(e1) throw e1;const gd=grupos.map((g,i)=>({registro_id:r.id,seq:i+1,qtd:parseInt(g.qtd)||0,unidade:g.unidade||'m',altura_m:g.alturaM??0,largura_m:g.larguraM??0,comprimento_m:g.comprimentoM??0,m3_grupo:(g.alturaM??0)*(g.larguraM??0)*(g.comprimentoM??0)*(parseInt(g.qtd)||0)}));const {error:e2}=await sb.from('grupos').insert(gd);if(e2) throw e2;return {...r,grupos:gd}},
async editarRegistro(regId,grupos,motivo,m3Total,perfil){const {error:e1}=await sb.from('registros').update({m3_total:m3Total,editado:true,editado_por:perfil.email,motivo_edicao:motivo,data_edicao:new Date().toISOString()}).eq('id',regId);if(e1) throw e1;await sb.from('grupos').delete().eq('registro_id',regId);const gd=grupos.map((g,i)=>({registro_id:regId,seq:i+1,qtd:parseInt(g.qtd)||0,unidade:g.unidade||'m',altura_m:g.alturaM??0,largura_m:g.larguraM??0,comprimento_m:g.comprimentoM??0,m3_grupo:(g.alturaM??0)*(g.larguraM??0)*(g.comprimentoM??0)*(parseInt(g.qtd)||0)}));const {error:e2}=await sb.from('grupos').insert(gd);if(e2) throw e2;await sb.from('historico_edicoes').insert({registro_id:regId,user_email:perfil.email,motivo})},
async deletarRegistro(id){const {error}=await sb.from('registros').delete().eq('id',id);if(error) throw error},
async listarUsuarios(){const {data,error}=await sb.from('perfis').select('*').order('criado_em');if(error) throw error;return data||[]},
async contarSolicitacoesSenha(){const {count,error}=await sb.from('perfis').select('*',{count:'exact',head:true}).eq('solicitou_reset_senha',true);if(error) throw error;return count||0},
async atualizarRole(userId,role){const {error}=await sb.from('perfis').update({role}).eq('id',userId);if(error) throw error},
async listarPendencias(){const {data,error}=await sb.from('pendencias_emissao').select('*, grupos:pendencias_emissao_grupos(*)').order('criado_em',{ascending:false});if(error) throw error;return (data||[]).map(p=>({...p,grupos:(p.grupos||[]).sort((a,b)=>a.seq-b.seq)}))},
async buscarRegistrosPorCliente(cliente){if(!cliente) return [];const {data,error}=await sb.from('registros').select('*, grupos(*)').eq('cliente',cliente).order('criado_em',{ascending:false}).limit(30);if(error) throw error;return (data||[]).map(r=>({...r,grupos:(r.grupos||[]).sort((a,b)=>a.seq-b.seq)}))},
async criarPendencia(payload,grupos){const {data:p,error:e1}=await sb.from('pendencias_emissao').insert(payload).select().single();if(e1) throw e1;if(grupos&&grupos.length){const gd=grupos.map((g,i)=>({pendencia_id:p.id,seq:i+1,qtd:parseInt(g.qtd)||0,unidade:g.unidade||'m',altura_m:g.alturaM??0,largura_m:g.larguraM??0,comprimento_m:g.comprimentoM??0,m3_grupo:(g.alturaM??0)*(g.larguraM??0)*(g.comprimentoM??0)*(parseInt(g.qtd)||0)}));const {error:e2}=await sb.from('pendencias_emissao_grupos').insert(gd);if(e2) throw e2}return p},
async atualizarPendencia(id,patch){const {error}=await sb.from('pendencias_emissao').update(patch).eq('id',id);if(error) throw error},
async atualizarGruposPendencia(pendenciaId,grupos,m3Total){await sb.from('pendencias_emissao_grupos').delete().eq('pendencia_id',pendenciaId);const gd=grupos.map((g,i)=>({pendencia_id:pendenciaId,seq:i+1,qtd:parseInt(g.qtd)||0,unidade:g.unidade||'m',altura_m:g.alturaM??0,largura_m:g.larguraM??0,comprimento_m:g.comprimentoM??0,m3_grupo:(g.alturaM??0)*(g.larguraM??0)*(g.comprimentoM??0)*(parseInt(g.qtd)||0)}));if(gd.length){const {error}=await sb.from('pendencias_emissao_grupos').insert(gd);if(error) throw error}const qtdTotal=grupos.reduce((s,g)=>s+(parseInt(g.qtd)||0),0);await this.atualizarPendencia(pendenciaId,{qtd_volumes:qtdTotal,m3_total:m3Total})},
async deletarPendencia(id){const {error}=await sb.from('pendencias_emissao').delete().eq('id',id);if(error) throw error},
async uploadNfImagem(file,pendenciaId){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${pendenciaId}/${Date.now()}.${ext}`;const {error}=await sb.storage.from('nf-anexos').upload(path,file,{upsert:true});if(error) throw error;return path},
async urlNfImagem(path){const {data,error}=await sb.storage.from('nf-anexos').createSignedUrl(path,3600);if(error) throw error;return data.signedUrl},
}

function Historico({frotas,perfil,showToast}){const [editReg,setEditReg]=useState(null);const [confirmDel,setConfirmDel]=useState(null);const [filtroFrota,setFiltroFrota]=useState('');const [filtroNota,setFiltroNota]=useState('');const [dataIni,setDataIni]=useState(todayStr());const [dataFim,setDataFim]=useState(todayStr());const [registros,setRegistros]=useState([]);const [carregando,setCarregando]=useState(true);const recarregar=useCallback(async()=>{ setCarregando(true); try{ setRegistros(await db.listarRegistrosPorPeriodo(dataIni,dataFim,filtroFrota||null)) }catch(e){ showToast('Erro ao carregar histórico: '+e.message,'err') }; setCarregando(false) },[dataIni,dataFim,filtroFrota]);useEffect(()=>{ recarregar() },[recarregar]);const lista=[...(registros||[])].filter(r=>!filtroNota||r.nota.toLowerCase().includes(filtroNota.toLowerCase())).sort((a,b)=>new Date(b.criado_em)-new Date(a.criado_em));const handleDelete=async id=>{ try{await db.deletarRegistro(id);setConfirmDel(null);showToast('Cubagem excluída.','err');await recarregar()}catch(e){showToast('Erro: '+e.message,'err')} };const handleEdit=async(id,grupos,motivo)=>{ const m3=calcM3(grupos); try{await db.editarRegistro(id,grupos.map(g=>({...g,...dimsM(g)})),motivo,m3,perfil);setEditReg(null);showToast('Cubagem atualizada!');await recarregar()}catch(e){showToast('Erro: '+e.message,'err')} };const downloadCSV=()=>{ const BOM='\uFEFF'; const header=['ID','Frota','Data','Usuário','Cliente','Nota','Vol.Total','Grupo','Vol.Grupo','Alt(m)','Larg(m)','Comp(m)','M³Grupo','M³Total','Status'].join(';'); const rows=[]; lista.forEach(r=>{ (r.grupos||[]).forEach((g,gi)=>{ const a=g.altura_m??0,l=g.largura_m??0,c=g.comprimento_m??0; rows.push([r.id,r.frota_placa,fmtDate(r.criado_em),r.user_email,r.cliente,r.nota,r.qtd_total,`G${gi+1}`,g.qtd,a.toFixed(3),l.toFixed(3),c.toFixed(3),(a*l*c*g.qtd).toFixed(4),parseFloat(r.m3_total).toFixed(4),r.editado?'EDITADO':'ORIGINAL'].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';') function PendenciaEmissao({perfil,session,frotas,clientes,showToast}){const [lista,setLista]=useState([]);const [carregando,setCarregando]=useState(true);const [showForm,setShowForm]=useState(false);const [editPend,setEditPend]=useState(null);const [confirmDel,setConfirmDel]=useState(null);const [mesRef,setMesRef]=useState(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});const recarregar=useCallback(async()=>{ setCarregando(true); try{ setLista(await db.listarPendencias()) }catch(e){ showToast('Erro ao carregar pendências: '+e.message,'err') } setCarregando(false) },[showToast]);useEffect(()=>{ recarregar() },[recarregar]);const handleDelete=async(id)=>{ try{ await db.deletarPendencia(id); setConfirmDel(null); showToast('Pendência excluída.','err'); await recarregar() }catch(e){ showToast('Erro: '+e.message,'err') } };const pendentes=lista.filter(p=>p.status_expedicao!=='expedido');const expedidos=lista.filter(p=>p.status_expedicao==='expedido'&&p.expedido_em&&p.expedido_em.slice(0,7)===mesRef);const FaltaBadge=({p})=>p.houve_falta?<div style={{...S.badge,background:'#2a1515',color:'#e05050',marginTop:3}}>⚠ falta {p.qtd_falta||''}</div>:null;const Linha=({p,modo})=>(<tr style={{background:modo==='liberado'?'rgba(59,130,246,0.22)':'transparent'}}><td style={{...S.td,fontSize:10,whiteSpace:'nowrap'}}>{fmtDate(p.criado_em)}</td><td className="cb-hide-mobile" style={{...S.td,fontSize:10,color:'#6b7280'}}>{p.criado_por_nome||'—'}</td><td style={S.td}>{p.cliente}</td><td style={{...S.td,fontWeight:700,color:'#22d3ee',whiteSpace:'nowrap'}}>{p.frota_placa||'—'}</td><td style={{...S.td,whiteSpace:'nowrap'}}>{p.nf_numero||'—'}</td><td style={{...S.td,textAlign:'center'}}>{p.qtd_volumes}<FaltaBadge p={p}/></td><td className="cb-hide-mobile" style={S.td}><GruposDetalhe grupos={p.grupos}/></td><td style={{...S.td,fontWeight:700,whiteSpace:'nowrap'}}>{parseFloat(p.m3_total).toFixed(4)}</td><td style={S.td}><StatusBadge map={STATUS_EXP_COLORS} value={p.status_expedicao} label={STATUS_EXP_LABELS[p.status_expedicao]}/></td><td style={S.td}><StatusBadge map={{em_analise:{bg:'#2a2010',color:'#eab308'},liberado:{bg:'#0e2a3a',color:'#60a5fa'}}} value={p.status_comercial} label={p.status_comercial==='liberado'?'Liberado':'Em análise'}/></td><td className="cb-hide-mobile" style={{...S.td,fontSize:11,maxWidth:130}}>{p.observacao_expedicao||'—'}</td><td className="cb-hide-mobile" style={{...S.td,fontSize:11,maxWidth:130}}>{p.observacao_comercial||'—'}</td><td style={{...S.td,fontSize:11,whiteSpace:'nowrap'}}>{p.cotacao_numero||'—'}</td><td className="cb-hide-mobile" style={{...S.td,fontSize:10,whiteSpace:'nowrap'}}>{p.chave_nf||'—'}</td>{modo==='liberado'&&(<><td style={{...S.td,fontSize:10,whiteSpace:'nowrap'}}>{p.expedido_em?fmtDate(p.expedido_em):'—'}</td><td className="cb-hide-mobile" style={{...S.td,fontSize:10}}>{p.expedido_por_nome||'—'}</td></>)}<td style={S.td}><div style={{display:'flex',gap:4}}><button style={{...S.btnS,padding:'3px 7px',fontSize:11}} onClick={()=>setEditPend(p)}>✎</button>{podeExcluirPendencia(perfil)&&<button style={{...S.btnD,padding:'3px 7px',fontSize:11}} onClick={()=>setConfirmDel(p)}>🗑</button>}</div></td></tr>);const Header=({modo})=>(<tr><th style={S.th}>Data</th><th className="cb-hide-mobile" style={S.th}>Inserido por</th><th style={S.th}>Cliente</th><th style={S.th}>Frota</th><th style={S.th}>NF</th><th style={S.th}>Vol.</th><th className="cb-hide-mobile" style={S.th}>Medidas</th><th style={S.th}>M³</th><th style={S.th}>Expedição</th><th style={S.th}>Comercial</th><th className="cb-hide-mobile" style={S.th}>Obs. Exp.</th><th className="cb-hide-mobile" style={S.th}>Obs. Com.</th><th style={S.th}>Cotação</th><th className="cb-hide-mobile" style={S.th}>Chave NF</th>{modo==='liberado'&&(<><th style={S.th}>Expedido em</th><th className="cb-hide-mobile" style={S.th}>Expedido por</th></>)}<th style={S.th}>Ações</th></tr>);return (<div className="cb-page"><div className="cb-sync-bar"><h1 style={{fontSize:16,fontWeight:700,color:'#22d3ee',letterSpacing:2,flex:1,minWidth:180,fontFamily:"'Space Grotesk','Inter',sans-serif"}}>PENDÊNCIA DE EMISSÃO</h1>{isExpedicao(perfil)&&<button style={S.btnY} onClick={()=>setShowForm(true)}>+ Nova pendência</button>}</div>{carregando?<SkeletonTableRows rows={5} cols={9}/>:(<><div className="cb-card"><div style={S.secT}>Pendentes / em análise ({pendentes.length})</div><div style={{fontSize:10,color:'#6b7280',marginBottom:10}}>Fica aqui até ser expedido, independente do mês.</div>{pendentes.length===0?<p style={{color:'#6b7280',fontSize:13}}>Nenhuma pendência em aberto.</p>:<div className="cb-table-wrap"><table style={S.table}><thead><Header modo="pendente"/></thead><tbody>{pendentes.map(p=><Linha key={p.id} p={p} modo="pendente"/>)}</tbody></table></div>}</div><div className="cb-card"><div className="cb-row" style={{alignItems:'center',marginBottom:2}}><div style={S.secT}>Liberados/expedidos ({expedidos.length})</div><input style={{...S.input,width:160,marginLeft:'auto'}} type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)}/></div><div style={{fontSize:10,color:'#6b7280',marginBottom:10}}>Relatório mensal — filtra pela data em que foi marcado "Expedido".</div>{expedidos.length===0?<p style={{color:'#6b7280',fontSize:13}}>Nenhuma liberação neste mês.</p>:<div className="cb-table-wrap"><table style={S.table}><thead><Header modo="liberado"/></thead><tbody>{expedidos.map(p=><Linha key={p.id} p={p} modo="liberado"/>)}</tbody></table></div>}</div></>)}{showForm&&<PendenciaModal frotas={frotas} clientes={clientes} perfil={perfil} session={session} onClose={()=>setShowForm(false)} onSave={()=>{setShowForm(false);showToast('Pendência criada!');recarregar()}}/>}{editPend&&<PendenciaModal pendencia={editPend} frotas={frotas} clientes={clientes} perfil={perfil} session={session} onClose={()=>setEditPend(null)} onSave={()=>{setEditPend(null);showToast('Pendência atualizada!');recarregar()}}/>}{confirmDel&&(<div style={S.modal} onClick={e=>e.target===e.currentTarget&&setConfirmDel(null)}><div className="cb-modal-box" style={{maxWidth:380}}><div style={{fontSize:14,fontWeight:700,color:'#e05050',marginBottom:14}}>⚠️ EXCLUIR PENDÊNCIA</div><div style={{fontSize:13,color:'#a0a8c0',lineHeight:2,marginBottom:18}}>Excluir pendência de <b style={{color:'#e8eaf0'}}>{confirmDel.cliente}</b>?<br/><span style={{color:'#e05050'}}>Esta ação não pode ser desfeita.</span></div><div style={{display:'flex',gap:8}}><button style={{...S.btnS,flex:1}} onClick={()=>setConfirmDel(null)}>Cancelar</button><button style={{...S.btnD,flex:1,background:'#2a1515',fontWeight:700}} onClick={()=>handleDelete(confirmDel.id)}>Confirmar</button></div></div></div>)}</div>)}
function App(){const [session,setSession]=useState(null);const [perfil,setPerfil]=useState(null);const [frotas,setFrotas]=useState([]);const [clientes,setClientes]=useState([]);const [view,setView]=useState('dashboard');const [frota,setFrota]=useState(null);const [toast,setToast]=useState(null);const [loading,setLoading]=useState(true);const [trocaSenhaVoluntaria,setTrocaSenhaVoluntaria]=useState(false);const [solicitacoesPendentes,setSolicitacoesPendentes]=useState(0);const showToast=(msg,type='ok')=>{ setToast({msg,type}); setTimeout(()=>setToast(null),3500) };const carregarDados=useCallback(async()=>{ const [f,c]=await Promise.all([db.listarFrotas(),db.listarClientes()]); setFrotas(f);setClientes(c) },[]);const atualizarBadgeSolicitacoes=useCallback(async(p)=>{ if(!isAdmin(p)) return; try{ setSolicitacoesPendentes(await db.contarSolicitacoesSenha()) }catch{} },[]);const [erroFatal,setErroFatal]=useState('');useEffect(()=>{ sb.auth.getSession().then(async({data:{session}})=>{ try{ if(session){setSession(session);const p=await db.getPerfil(session.user.id);setPerfil(p);await carregarDados();await atualizarBadgeSolicitacoes(p)} } catch(e){ setErroFatal(e.message||'Erro ao carregar sessão.') }; setLoading(false) }); const {data:{subscription}}=sb.auth.onAuthStateChange(async(event,session)=>{ try{ if(session){setSession(session);const p=await db.getPerfil(session.user.id);setPerfil(p);await carregarDados();await atualizarBadgeSolicitacoes(p)} else{setSession(null);setPerfil(null);setFrotas([]);setClientes([]);setView('dashboard');setFrota(null);setSolicitacoesPendentes(0)} }catch(e){ setErroFatal(e.message||'Erro ao carregar sessão.') } }); return ()=>subscription.unsubscribe() },[carregarDados,atualizarBadgeSolicitacoes]);if(erroFatal) return (<div style={S.center}><div style={S.box}><div style={{...S.logoT,color:'#e05050'}}>Erro ao carregar</div><div style={S.errBox}>{erroFatal}</div><button style={{...S.btnP,marginTop:16}} onClick={()=>{sb.auth.signOut();window.location.reload()}}>Sair e tentar de novo</button></div></div>);if(loading) return (<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f1117,#1a1f2e)'}}><div style={{textAlign:'center'}}><div style={{fontSize:22,fontWeight:700,color:'#22d3ee',letterSpacing:2}}>CUBAGENS</div><div style={{fontSize:12,color:'#6b7280',letterSpacing:2,marginTop:10}}>CARREGANDO...</div></div></div>);if(!session) return <Login onLogin={(e,s)=>db.signIn(e,s)}/>;if(perfil?.deve_trocar_senha) return (<TrocaSenha obrigatoria onSave={async(novaSenha)=>{ await db.trocarSenha(novaSenha,session.user.id); setPerfil(p=>({...p,deve_trocar_senha:false})); showToast('Senha atualizada!') }}/>);return (<div style={{minHeight:'100vh',background:'#0f1117',color:'#e8eaf0',fontFamily:"'Inter',sans-serif"}}><nav className="cb-nav"><span className="cb-nav-title cb-brand" style={{fontSize:13,fontWeight:700,color:'#22d3ee',letterSpacing:2,flex:1}}>▣ CUBAGENS</span><span className="cb-nav-badge" style={{fontSize:11,color:'#6b7280'}}>{perfil?.nome}</span><span className="cb-nav-badge"><RoleBadge role={perfil?.role}/></span>{isAdmin(perfil)&&(<button style={{...S.btnS,position:'relative'}} onClick={()=>setView('admin')}>Admin{solicitacoesPendentes>0&&<span style={{position:'absolute',top:-6,right:-6,background:'#e05050',color:'#fff',borderRadius:10,fontSize:10,fontWeight:700,padding:'1px 5px',lineHeight:1.4}}>{solicitacoesPendentes}</span>}</button>)}{podeVerPendencias(perfil)&&<button style={S.btnS} onClick={()=>setView('pendencias')}>Pendência NF</button>}<button style={S.btnS} onClick={()=>setView('historico')}>Histórico</button><button style={S.btnS} onClick={()=>{setView('dashboard');setFrota(null)}}>Início</button><button style={S.btnS} onClick={()=>setTrocaSenhaVoluntaria(true)}>Senha</button><button style={S.btnD} onClick={()=>db.signOut()}>Sair</button></nav>{trocaSenhaVoluntaria&&(<TrocaSenha onClose={()=>setTrocaSenhaVoluntaria(false)} onSave={async(novaSenha)=>{ await db.trocarSenha(novaSenha,session.user.id); setTrocaSenhaVoluntaria(false); showToast('Senha atualizada!') }}/>)}{toast&&(<div style={{position:'fixed',top:58,right:10,left:10,zIndex:300,padding:'10px 14px',borderRadius:8,fontSize:13,fontFamily:'inherit',background:toast.type==='ok'?'#0f2a1a':'#2a1515',border:`1px solid ${toast.type==='ok'?'#40c080':'#e05050'}`,color:toast.type==='ok'?'#40c080':'#e05050',maxWidth:380,marginLeft:'auto'}}>{toast.msg}</div>)}<div key={view} className="cb-view-enter">{view==='dashboard'&&<Dashboard frotas={frotas} onFrota={f=>{setFrota(f);setView('frota')}}/>}{view==='frota'&&frota&&<FrotaView frota={frota} clientes={clientes} session={session} perfil={perfil} onBack={()=>setView('dashboard')} showToast={showToast}/>}{view==='admin'&&isAdmin(perfil)&&<AdminView perfil={perfil} session={session} frotas={frotas} setFrotas={setFrotas} clientes={clientes} setClientes={setClientes} showToast={showToast} onSolicitacoesAtualizadas={()=>atualizarBadgeSolicitacoes(perfil)}/>}{view==='historico'&&<Historico frotas={frotas} perfil={perfil} showToast={showToast}/>}{view==='pendencias'&&podeVerPendencias(perfil)&&<PendenciaEmissao perfil={perfil} session={session} frotas={frotas} clientes={clientes} showToast={showToast}/>}</div></div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
